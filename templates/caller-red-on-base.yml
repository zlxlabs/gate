# Thin business-repo caller. Drop in as .github/workflows/red-on-base.yml.
name: red-on-base

on:
  workflow_dispatch:
    inputs:
      dispatch_id:    { type: string, required: true }
      contrast_sha:   { type: string, required: true }
      tip_sha:        { type: string, required: true }
      contrast_tree:  { type: string, required: true }
      tip_tree:       { type: string, required: true }
      pytest_files:   { type: string, required: true, description: "JSON array of repo-relative pytest paths" }
      shell_files:    { type: string, required: true, description: "JSON array of repo-relative test*.sh paths" }
      timeout_minutes: { type: string, required: false, default: "15" }

permissions:
  contents: read
  actions: write

jobs:
  red-on-base:
    uses: zlxlabs/gate/.github/workflows/red-on-base.yml@v2
    with:
      dispatch_id: ${{ inputs.dispatch_id }}
      contrast_sha: ${{ inputs.contrast_sha }}
      tip_sha: ${{ inputs.tip_sha }}
      contrast_tree: ${{ inputs.contrast_tree }}
      tip_tree: ${{ inputs.tip_tree }}
      pytest_files: ${{ inputs.pytest_files }}
      shell_files: ${{ inputs.shell_files }}
      timeout_minutes: ${{ fromJSON(inputs.timeout_minutes) }}
