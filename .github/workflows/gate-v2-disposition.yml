name: gate-v2 disposition control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "issue or revoke an immutable disposition artifact"
        required: true
        type: choice
        options: [issue, revoke]
      repository_id: { description: "numeric repository id", required: true, type: string }
      pr_number: { description: "pull request number", required: true, type: string }
      epoch: { description: "current epoch for revocation", required: false, type: string }
      primary_run_id: { description: "canonical primary run id", required: false, type: string }
      primary_run_attempt: { description: "canonical primary run attempt", required: false, type: string }
      finding_id: { description: "exact current-audit finding id", required: false, type: string }
      disposition: { description: "protected disposition kind", required: false, default: false-positive, type: choice, options: [false-positive, accepted, wont-fix, fixed] }
      reason: { description: "evidence-backed reason or revocation reason", required: true, type: string }
      evidence_refs: { description: "one immutable evidence ref per line", required: false, type: string }
      nonce: { description: "single-use immutable nonce", required: true, type: string }
      expires_at: { description: "receipt expiry in UTC", required: false, type: string }

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: gate-disposition-${{ inputs.repository_id }}-${{ inputs.pr_number }}-${{ inputs.nonce }}
  cancel-in-progress: false

jobs:
  control:
    # The gate-disposition environment is configured with required reviewers;
    # the environment approval is the protected issuer boundary.
    environment:
      name: gate-disposition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout disposition producer
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            .github/actions/gate-disposition/issue_receipt.py
            .github/actions/gate-aggregator/convergence.py
          fetch-depth: 1

      - name: Resolve current PR head and canonical primary audit
        if: ${{ inputs.operation == 'issue' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PRIMARY_RUN_ID: ${{ inputs.primary_run_id }}
          PRIMARY_RUN_ATTEMPT: ${{ inputs.primary_run_attempt }}
        run: |
          set -euo pipefail
          test -n "$PRIMARY_RUN_ID"
          test -n "$PRIMARY_RUN_ATTEMPT"
          pr_json="$RUNNER_TEMP/current-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson id "$GITHUB_REPOSITORY_ID" \
            '.head.sha and .base.sha and (.head.repo.full_name == $repo) and ($id > 0)' \
            "$pr_json" > /dev/null
          head_sha="$(jq -r '.head.sha' "$pr_json")"
          author_login="$(jq -r '.user.login' "$pr_json")"
          audit_dir="$RUNNER_TEMP/current-primary-audit"
          mkdir -p "$audit_dir"
          audit_name="primary-audit-v2-${GITHUB_REPOSITORY_ID}-${head_sha}-${PRIMARY_RUN_ID}-${PRIMARY_RUN_ATTEMPT}"
          gh run download "$PRIMARY_RUN_ID" --name "$audit_name" --dir "$audit_dir"
          audit_path="$(find "$audit_dir" -type f -name '*.json' -print -quit)"
          test -n "$audit_path"
          audit_digest="$(sha256sum "$audit_path" | cut -d' ' -f1)"
          jq -e --arg head "$head_sha" --argjson pr "$PR_NUMBER" --argjson run "$PRIMARY_RUN_ID" --argjson attempt "$PRIMARY_RUN_ATTEMPT" \
            '.head_sha == $head and (.pr == $pr or .pr_number == $pr) and .run_id == $run and .run_attempt == $attempt' "$audit_path" > /dev/null
          {
            echo "AUDIT_PATH=$audit_path"
            echo "CURRENT_PR_PATH=$pr_json"
            echo "CURRENT_PR_AUTHOR=$author_login"
            echo "CURRENT_HEAD_SHA=$head_sha"
            echo "CURRENT_AUDIT_DIGEST=$audit_digest"
            echo "CURRENT_DIFF_DIGEST=$(jq -r '.diff_digest' "$audit_path")"
            echo "CURRENT_SOURCE_ATTEMPT=$PRIMARY_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"

      - name: Construct canonical scope and derive epoch
        if: ${{ inputs.operation == 'issue' }}
        env:
          AUDIT_PATH: ${{ runner.temp }}/current-primary-audit/primary-review-audit.json
          PR_PATH: ${{ runner.temp }}/current-pr.json
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          scope_envelope="$(python3 - "$AUDIT_PATH" "$PR_PATH" "$REPOSITORY_ID" "$PR_NUMBER" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          audit = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pull = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          repository_id = int(sys.argv[3])
          pr_number = int(sys.argv[4])
          required = (
              "diff_digest", "policy_version", "policy_digest", "tier",
              "effective_tier", "infra_classifier_version", "infra_diff",
              "caller_sha", "reusable_workflow_sha", "base_sha", "head_sha",
          )
          missing = [field for field in required if field not in audit]
          if missing:
              raise SystemExit("canonical audit missing scope fields: " + ",".join(missing))
          base_sha = pull["base"]["sha"]
          head_sha = pull["head"]["sha"]
          if audit["base_sha"] != base_sha or audit["head_sha"] != head_sha:
              raise SystemExit("canonical audit scope disagrees with current PR base/head")
          module_path = ".github/actions/gate-aggregator/convergence.py"
          spec = importlib.util.spec_from_file_location("gate_convergence_scope", module_path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          scope = module.Scope(
              repository_id=repository_id,
              pr_number=pr_number,
              base_sha=base_sha,
              head_sha=head_sha,
              diff_digest=audit["diff_digest"],
              policy_version=audit["policy_version"],
              policy_digest=audit["policy_digest"],
              tier=audit["tier"],
              effective_tier=audit["effective_tier"],
              infra_classifier_version=audit["infra_classifier_version"],
              infra_diff=audit["infra_diff"],
              caller_sha=audit["caller_sha"],
              reusable_workflow_sha=audit["reusable_workflow_sha"],
          )
          module.validate_scope(scope)
          print(json.dumps({"scope": scope.as_dict(), "epoch": module.derive_epoch(scope)}, sort_keys=True, separators=(",", ":")))
          PY
          )"
          scope_json="$(printf '%s' "$scope_envelope" | jq -c '.scope')"
          epoch="$(printf '%s' "$scope_envelope" | jq -r '.epoch')"
          echo "CURRENT_SCOPE_JSON=$scope_json" >> "$GITHUB_ENV"
          echo "CURRENT_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Resolve and verify immutable evidence blobs
        if: ${{ inputs.operation == 'issue' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_REFS: ${{ inputs.evidence_refs }}
        run: |
          set -euo pipefail
          refs_path="$RUNNER_TEMP/disposition-evidence-refs.txt"
          records_path="$RUNNER_TEMP/disposition-evidence-records.tsv"
          manifest_path="$RUNNER_TEMP/disposition-evidence-manifest.json"
          printf '%s\n' "$EVIDENCE_REFS" > "$refs_path"
          : > "$records_path"
          while IFS= read -r evidence_ref || [ -n "$evidence_ref" ]; do
            test -n "$evidence_ref"
            case "$evidence_ref" in
              blob:*)
                blob_sha="${evidence_ref#blob:}"
                if ! [[ "$blob_sha" =~ ^[0-9a-f]{40}$ ]]; then
                  echo "evidence ref is not an immutable Git blob SHA" >&2
                  exit 1
                fi
                response_path="$RUNNER_TEMP/evidence-$blob_sha.json"
                evidence_path="$RUNNER_TEMP/evidence-$blob_sha.bin"
                gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob_sha" > "$response_path"
                jq -e --arg sha "$blob_sha" '.sha == $sha and .encoding == "base64" and (.content | type == "string")' "$response_path" > /dev/null
                jq -r '.content' "$response_path" | tr -d '\n\r' | base64 --decode > "$evidence_path"
                content_sha256="$(sha256sum "$evidence_path" | cut -d' ' -f1)"
                test "$(git hash-object "$evidence_path")" = "$blob_sha"
                printf '%s\t%s\t%s\n' "$evidence_ref" "$evidence_path" "$content_sha256" >> "$records_path"
                ;;
              *)
                echo "unsupported evidence ref; only blob:<git-sha> is allowlisted" >&2
                exit 1
                ;;
            esac
          done < "$refs_path"
          python3 - "$records_path" "$manifest_path" <<'PY'
          import json
          import sys
          from pathlib import Path

          records = []
          for line in Path(sys.argv[1]).read_text().splitlines():
              ref, path, sha256 = line.split("\t")
              records.append({"type": "blob", "ref": ref, "path": path, "sha256": sha256})
          if not records:
              raise SystemExit("evidence manifest must contain at least one verified blob")
          Path(sys.argv[2]).write_text(json.dumps(records, sort_keys=True, separators=(",", ":")))
          PY
          echo "EVIDENCE_MANIFEST_PATH=$manifest_path" >> "$GITHUB_ENV"

      - name: Enforce protected issuer and exact evidence input
        if: ${{ inputs.operation == 'issue' }}
        env:
          EVIDENCE_REFS: ${{ inputs.evidence_refs }}
        run: |
          set -euo pipefail
          test -n "$EVIDENCE_REFS"
          if [ "$CURRENT_PR_AUTHOR" = "$GITHUB_ACTOR" ]; then
            echo "PR author cannot issue a disposition receipt; a distinct protected issuer is required" >&2
            exit 1
          fi

      - name: Issue or revoke immutable disposition artifact
        id: disposition
        env:
          OPERATION: ${{ inputs.operation }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          DISPOSITION_EPOCH: ${{ inputs.epoch }}
          PRIMARY_RUN_ID: ${{ inputs.primary_run_id }}
          PRIMARY_RUN_ATTEMPT: ${{ inputs.primary_run_attempt }}
          FINDING_ID: ${{ inputs.finding_id }}
          DISPOSITION_KIND: ${{ inputs.disposition }}
          DISPOSITION_REASON: ${{ inputs.reason }}
          DISPOSITION_EVIDENCE_REFS: ${{ inputs.evidence_refs }}
          DISPOSITION_APPROVAL_REF: ${{ inputs.approval_ref }}
          DISPOSITION_NONCE: ${{ inputs.nonce }}
          DISPOSITION_EXPIRES_AT: ${{ inputs.expires_at }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_ACTOR: ${{ github.actor }}
          OUTPUT_DIR: ${{ runner.temp }}/gate-disposition-artifact
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          if [ "$OPERATION" = issue ]; then
            test -n "$AUDIT_PATH"
            test -n "$CURRENT_HEAD_SHA"
            test -n "$CURRENT_AUDIT_DIGEST"
            test -n "$CURRENT_DIFF_DIGEST"
            test -n "$CURRENT_EPOCH"
            output="$(python3 .github/actions/gate-disposition/issue_receipt.py issue \
              --output-dir "$OUTPUT_DIR" --audit-path "$AUDIT_PATH" \
              --repository-id "$REPOSITORY_ID" --pr-number "$PR_NUMBER" \
              --epoch "$CURRENT_EPOCH" --head-sha "$CURRENT_HEAD_SHA" \
              --diff-digest "$CURRENT_DIFF_DIGEST" --primary-run-id "$PRIMARY_RUN_ID" \
              --primary-run-attempt "$PRIMARY_RUN_ATTEMPT" --finding-id "$FINDING_ID" \
              --disposition "$DISPOSITION_KIND" --issuer-login "$GITHUB_ACTOR" \
              --issuer-user-id "$GITHUB_ACTOR_ID" --control-run-id "$GITHUB_RUN_ID" \
              --pr-author-login "$CURRENT_PR_AUTHOR" \
              --approval-ref "protected-environment:gate-disposition;issuer-not-author:$CURRENT_PR_AUTHOR" \
              --scope-json "$CURRENT_SCOPE_JSON" --issued-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --expires-at "$DISPOSITION_EXPIRES_AT" --nonce "$DISPOSITION_NONCE" \
              --reason "$DISPOSITION_REASON" --evidence-ref "$DISPOSITION_EVIDENCE_REFS" \
              --evidence-manifest-path "$EVIDENCE_MANIFEST_PATH" \
              --audit-digest "$CURRENT_AUDIT_DIGEST")"
          elif [ "$OPERATION" = revoke ]; then
            output="$(python3 .github/actions/gate-disposition/issue_receipt.py revoke \
              --output-dir "$OUTPUT_DIR" --epoch "$DISPOSITION_EPOCH" --nonce "$DISPOSITION_NONCE" \
              --reason "$DISPOSITION_REASON" --actor "$GITHUB_ACTOR" \
              --revoked-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --evidence-ref "$DISPOSITION_EVIDENCE_REFS")"
          else
            echo "unsupported operation" >&2
            exit 1
          fi
          artifact_name="$(printf '%s' "$output" | jq -r '.artifact')"
          test -n "$artifact_name" && echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload immutable disposition artifact
        if: always() && steps.disposition.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.disposition.outputs.artifact_name }}
          path: ${{ runner.temp }}/gate-disposition-artifact/*
          if-no-files-found: error
          retention-days: 30
