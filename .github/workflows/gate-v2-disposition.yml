name: gate-v2 disposition control

on:
  workflow_dispatch:
    inputs:
      pr_number: { description: "pull request number", required: true, type: string }
      primary_run_id: { description: "canonical primary run id", required: true, type: string }
      primary_run_attempt: { description: "canonical primary run attempt", required: true, type: string }
      finding_id: { description: "exact current-audit finding id", required: true, type: string }
      reason: { description: "reason for the false-positive disposition", required: true, type: string }
      disposition: { description: "false-positive or deferred; omitted legacy calls are rejected without evidence", required: false, type: string }
      counterevidence_json: { description: "JSON object with command, output, result=refuted, and pointer for false-positive", required: false, type: string }
      tracking_issue: { description: "same-repository issue number (#N) or issues URL for deferred", required: false, type: string }
      gate_ref: { description: "deprecated compatibility input (ignored)", required: false, type: string }
  workflow_call:
    inputs:
      pr_number: { description: "pull request number", required: true, type: string }
      primary_run_id: { description: "canonical primary run id", required: true, type: string }
      primary_run_attempt: { description: "canonical primary run attempt", required: true, type: string }
      finding_id: { description: "exact current-audit finding id", required: true, type: string }
      reason: { description: "reason for the false-positive disposition", required: true, type: string }
      disposition: { description: "false-positive or deferred; omitted legacy calls are rejected without evidence", required: false, type: string }
      counterevidence_json: { description: "JSON object with command, output, result=refuted, and pointer for false-positive", required: false, type: string }
      tracking_issue: { description: "same-repository issue number (#N) or issues URL for deferred", required: false, type: string }
      gate_ref: { description: "deprecated compatibility input (ignored)", required: false, type: string }

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: gate-disposition-${{ github.repository_id }}-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  SILO_ENDPOINT: https://zlx-vm-work-i5-infra.taile9071.ts.net:9000
  SILO_BUCKET: ci-artifacts
  GATE_NET_RETRY_ATTEMPTS: "3"
  GATE_NET_RETRY_BACKOFF_SECS: "5 15"
  GATE_NET_ATTEMPT_TIMEOUT_SECS: "25"
  GATE_HTTP_LOW_SPEED_LIMIT: "1000"
  GATE_HTTP_LOW_SPEED_TIME: "20"

jobs:
  control:
    # Keep the environment so any future protection can be configured in GitHub.
    environment:
      name: gate-disposition
    # Silo is on tailnet; GitHub-hosted cannot reach 100.x. Use the ci pool
    # (same labels as quality), not ubuntu-latest.
    runs-on: [self-hosted, linux, ci]
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SILO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SILO_SECRET_KEY }}
      SILO_STORE: ${{ github.workspace }}/scripts/silo_store.py
      SILO_EXEC: ${{ github.workspace }}/scripts/silo_exec.sh
    steps:
      - name: Checkout disposition producer
        env:
          GATE_CHECKOUT_REPOSITORY: ${{ job.workflow_repository }}
          GATE_CHECKOUT_REF: ${{ job.workflow_sha }}
          GATE_CHECKOUT_SPARSE: |
            .github/actions/gate-disposition/issue_receipt.py
            .github/actions/gate-aggregator/convergence.py
            scripts/silo_store.py
            scripts/silo_exec.sh
          GATE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -c "import os, pathlib; p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gate-api.hdr'; p.write_text('Authorization: Bearer ' + os.environ['GATE_GITHUB_TOKEN'] + chr(10) + 'Accept: application/vnd.github.raw' + chr(10) + 'User-Agent: gate-bounded-retry' + chr(10), encoding='ascii'); p.chmod(0o600)"
          [ -f "${RUNNER_TEMP}/gate_bounded_retry.py" ] || curl --fail -sS --retry "${GATE_NET_RETRY_ATTEMPTS}" --retry-all-errors --retry-delay "${GATE_NET_RETRY_BACKOFF_SECS%% *}" --max-time "${GATE_NET_ATTEMPT_TIMEOUT_SECS}" -H "@${RUNNER_TEMP}/gate-api.hdr" -o "${RUNNER_TEMP}/gate_bounded_retry.py" "${GITHUB_API_URL:-https://api.github.com}/repos/${GATE_CHECKOUT_REPOSITORY}/contents/scripts/gate_bounded_retry.py?ref=${GATE_CHECKOUT_REF}"
          python3 "${RUNNER_TEMP}/gate_bounded_retry.py" checkout

      - name: Resolve Silo hostname via MagicDNS
        run: |
          set -euo pipefail
          SILO_RESOLUTION="$(python3 "${RUNNER_TEMP}/gate_bounded_retry.py" magicdns --silo-store "$SILO_STORE" --endpoint "$SILO_ENDPOINT" --nameserver 100.100.100.100)" || {
            echo "::error::Silo MagicDNS lookup failed; see the preceding MagicDNS attempt N/M failed: line for the underlying cause. SILO_ENDPOINT=${SILO_ENDPOINT}" >&2
            exit 1
          }
          SILO_IP="${SILO_RESOLUTION%% *}"; SILO_HOST="${SILO_RESOLUTION#* }"
          if [ -z "$SILO_IP" ] || [ -z "$SILO_HOST" ] || [ "$SILO_IP" = "$SILO_RESOLUTION" ]; then
            echo "::error::Silo MagicDNS lookup failed; see the preceding MagicDNS attempt N/M failed: line for the underlying cause. SILO_ENDPOINT=${SILO_ENDPOINT}" >&2
            exit 1
          fi
          if grep -qF "$SILO_HOST" /etc/hosts; then printf 'Silo host %s already in /etc/hosts\n' "$SILO_HOST"
          elif [ "$(id -u)" -eq 0 ]; then printf '%s %s\n' "$SILO_IP" "$SILO_HOST" >> /etc/hosts
          else printf '%s %s\n' "$SILO_IP" "$SILO_HOST" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: Resolve current PR head and canonical primary audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PRIMARY_RUN_ID: ${{ inputs.primary_run_id }}
          PRIMARY_RUN_ATTEMPT: ${{ inputs.primary_run_attempt }}
        run: |
          set -euo pipefail
          test -n "$PRIMARY_RUN_ID"
          test -n "$PRIMARY_RUN_ATTEMPT"
          pr_json="$RUNNER_TEMP/current-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson id "$GITHUB_REPOSITORY_ID" \
            '.head.sha and .base.sha and (.head.repo.full_name == $repo) and ($id > 0)' \
            "$pr_json" > /dev/null
          head_sha="$(jq -r '.head.sha' "$pr_json")"
          audit_dir="$RUNNER_TEMP/current-primary-audit"
          mkdir -p "$audit_dir"
          audit_name="primary-audit-v2-${GITHUB_REPOSITORY_ID}-${head_sha}-${PRIMARY_RUN_ID}-${PRIMARY_RUN_ATTEMPT}"
          silo_key="d14/${GITHUB_REPOSITORY_ID}/${audit_name}/primary-review-audit.json"
          dest="$audit_dir/primary-review-audit.json"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::SILO_ACCESS_KEY 未传入" >&2; exit 1; }
          set +e
          "$SILO_EXEC" get --key "$silo_key" --dest "$dest"
          silo_rc=$?
          set -e
          if [ "$silo_rc" -eq 2 ]; then
            gh run download -R "$GITHUB_REPOSITORY" "$PRIMARY_RUN_ID" --name "$audit_name" --dir "$audit_dir"
          elif [ "$silo_rc" -ne 0 ]; then
            echo "::error::Silo get failed for canonical primary audit (exit=${silo_rc})" >&2
            exit "$silo_rc"
          fi
          audit_path="$(find "$audit_dir" -type f -name '*.json' -print -quit)"
          test -n "$audit_path"
          audit_digest="$(sha256sum "$audit_path" | cut -d' ' -f1)"
          jq -e --arg head "$head_sha" --argjson pr "$PR_NUMBER" --argjson run "$PRIMARY_RUN_ID" --argjson attempt "$PRIMARY_RUN_ATTEMPT" \
            '.head_sha == $head and (.pr == $pr or .pr_number == $pr) and .run_id == $run and .run_attempt == $attempt' "$audit_path" > /dev/null
          {
            echo "AUDIT_PATH=$audit_path"
            echo "CURRENT_PR_PATH=$pr_json"
            echo "CURRENT_HEAD_SHA=$head_sha"
            echo "CURRENT_AUDIT_DIGEST=$audit_digest"
          } >> "$GITHUB_ENV"

      - name: Construct canonical scope and derive epoch
        env:
          AUDIT_PATH: ${{ runner.temp }}/current-primary-audit/primary-review-audit.json
          PR_PATH: ${{ runner.temp }}/current-pr.json
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          scope_envelope="$(python3 - "$AUDIT_PATH" "$PR_PATH" "$REPOSITORY_ID" "$PR_NUMBER" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          audit = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pull = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          repository_id = int(sys.argv[3])
          pr_number = int(sys.argv[4])
          required = (
              "diff_digest", "policy_version", "policy_digest",
              "caller_sha", "reusable_workflow_sha", "base_sha", "head_sha",
          )
          missing = [field for field in required if field not in audit]
          if missing:
              raise SystemExit("canonical audit missing scope fields: " + ",".join(missing))
          base_sha = pull["base"]["sha"]
          head_sha = pull["head"]["sha"]
          if audit["base_sha"] != base_sha or audit["head_sha"] != head_sha:
              raise SystemExit("canonical audit scope disagrees with current PR base/head")
          module_path = Path(".github/actions/gate-aggregator/convergence.py").resolve()
          spec = importlib.util.spec_from_file_location("gate_convergence_scope", module_path)
          if spec is None or spec.loader is None:
              raise ImportError(f"convergence module is unavailable: {module_path}")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          scope = module.Scope(
              repository_id=repository_id,
              pr_number=pr_number,
              base_sha=base_sha,
              head_sha=head_sha,
              diff_digest=audit["diff_digest"],
              policy_version=audit["policy_version"],
              policy_digest=audit["policy_digest"],
              tier=audit.get("tier") if audit.get("tier") in module.SUPPORTED_TIERS else "internal",
              caller_sha=audit["caller_sha"],
              reusable_workflow_sha=audit["reusable_workflow_sha"],
          )
          module.validate_scope(scope)
          print(json.dumps({"scope": scope.as_dict(), "epoch": module.derive_epoch(scope)}, sort_keys=True, separators=(",", ":")))
          PY
          )"
          scope_json="$(printf '%s' "$scope_envelope" | jq -c '.scope')"
          epoch="$(printf '%s' "$scope_envelope" | jq -r '.epoch')"
          echo "CURRENT_SCOPE_JSON=$scope_json" >> "$GITHUB_ENV"
          echo "CURRENT_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Issue immutable disposition artifact
        id: disposition
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FINDING_ID: ${{ inputs.finding_id }}
          DISPOSITION_REASON: ${{ inputs.reason }}
          DISPOSITION_KIND: ${{ inputs.disposition }}
          DISPOSITION_COUNTEREVIDENCE_JSON: ${{ inputs.counterevidence_json }}
          DISPOSITION_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          DISPOSITION_APPROVER: ${{ github.actor }}
          DISPOSITION_APPROVER_ID: ${{ github.actor_id }}
          DISPOSITION_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/gate-disposition-artifact
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -n "$AUDIT_PATH"
          test -n "$CURRENT_HEAD_SHA"
          test -n "$CURRENT_AUDIT_DIGEST"
          test -n "$CURRENT_EPOCH"
          test -n "$DISPOSITION_APPROVER"
          test -n "$DISPOSITION_APPROVER_ID"
          approved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output="$(python3 .github/actions/gate-disposition/issue_receipt.py issue \
            --output-dir "$OUTPUT_DIR" --audit-path "$AUDIT_PATH" \
            --repository-id "$REPOSITORY_ID" --pr-number "$PR_NUMBER" \
            --head-sha "$CURRENT_HEAD_SHA" --finding-id "$FINDING_ID" \
            --reason "$DISPOSITION_REASON" --scope-json "$CURRENT_SCOPE_JSON" \
            --repository "$DISPOSITION_REPOSITORY" --disposition "$DISPOSITION_KIND" \
            --counterevidence-json "$DISPOSITION_COUNTEREVIDENCE_JSON" \
            --tracking-issue "$DISPOSITION_TRACKING_ISSUE" \
            --approver "$DISPOSITION_APPROVER" \
            --approver-id "$DISPOSITION_APPROVER_ID" \
            --approved-at "$approved_at")"
          artifact_name="$(printf '%s' "$output" | jq -r '.artifact')"
          test -n "$artifact_name" && echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload immutable disposition artifact
        if: always() && steps.disposition.outcome == 'success'
        env:
          ARTIFACT_NAME: ${{ steps.disposition.outputs.artifact_name }}
          OUTPUT_DIR: ${{ runner.temp }}/gate-disposition-artifact
        run: |
          set -euo pipefail
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::SILO_ACCESS_KEY 未传入" >&2; exit 1; }
          "$SILO_EXEC" put-dir \
            --tier d30 \
            --repo-id "${{ github.repository_id }}" \
            --name "$ARTIFACT_NAME" \
            --dir "$OUTPUT_DIR"
