name: gate-v2 disposition control

on:
  workflow_dispatch:
    inputs:
      pr_number: { description: "pull request number", required: true, type: string }
      primary_run_id: { description: "canonical primary run id", required: true, type: string }
      primary_run_attempt: { description: "canonical primary run attempt", required: true, type: string }
      finding_id: { description: "exact current-audit finding id", required: true, type: string }
      reason: { description: "reason for the false-positive disposition", required: true, type: string }
      disposition: { description: "false-positive or deferred; omitted legacy calls are rejected without evidence", required: false, type: string }
      counterevidence_json: { description: "JSON object with command, output, result=refuted, and pointer for false-positive", required: false, type: string }
      tracking_issue: { description: "same-repository issue number (#N) or issues URL for deferred", required: false, type: string }
      gate_ref: { description: "deprecated compatibility input (ignored)", required: false, type: string }
  workflow_call:
    inputs:
      pr_number: { description: "pull request number", required: true, type: string }
      primary_run_id: { description: "canonical primary run id", required: true, type: string }
      primary_run_attempt: { description: "canonical primary run attempt", required: true, type: string }
      finding_id: { description: "exact current-audit finding id", required: true, type: string }
      reason: { description: "reason for the false-positive disposition", required: true, type: string }
      disposition: { description: "false-positive or deferred; omitted legacy calls are rejected without evidence", required: false, type: string }
      counterevidence_json: { description: "JSON object with command, output, result=refuted, and pointer for false-positive", required: false, type: string }
      tracking_issue: { description: "same-repository issue number (#N) or issues URL for deferred", required: false, type: string }
      gate_ref: { description: "deprecated compatibility input (ignored)", required: false, type: string }
    secrets:
      SILO_ACCESS_KEY:
        description: "Silo 访问密钥 ID；缺省时 S3 步骤以「SILO_ACCESS_KEY 未传入」显式失败"
        required: false
      SILO_SECRET_KEY:
        description: "Silo 访问密钥 Secret；与 SILO_ACCESS_KEY 配对注入 control 作业"
        required: false

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: gate-disposition-${{ github.repository_id }}-${{ inputs.pr_number }}
  cancel-in-progress: false

env:
  # Host-declared git source (gate-hub W3b-1): $GATE_HUB_GIT_MIRROR_DIR/SOURCE-MODE
  # holds exactly one line, `service` or `origin`.  Decide it once, here, so the
  # checkout and every tool bootstrap below take the same branch; a declaration
  # that is present but unreadable or malformed fails the step.
  GATE_SOURCE_BUDGET_SECS: "180"
  GATE_SOURCE_DECIDE_SCRIPT: |
    set -euo pipefail
    export RUNNER_TEMP="${RUNNER_TEMP:-$(mktemp -d)}"
    mode=origin
    source_root=${GATE_HUB_GIT_MIRROR_DIR:-}
    if [ -n "$source_root" ]; then
      mode_file="$source_root/SOURCE-MODE"
      [ -r "$mode_file" ] || { echo "::error::SOURCE-MODE-UNREADABLE: $mode_file" >&2; exit 1; }
      # Byte-exact: the file must be exactly "origin\n" or "service\n".  Command
      # substitution strips trailing newlines, so append a sentinel that keeps the
      # file's own trailing bytes in the captured value; anything else (extra blank
      # line, missing final newline, CRLF, spaces) falls through to invalid.
      mode_raw=$(cat "$mode_file"; printf x)
      nl=$'\n'
      case "$mode_raw" in
        "origin${nl}x") mode=origin ;;
        "service${nl}x") mode=service ;;
        *) echo "::error::SOURCE-MODE-INVALID: $mode_file must contain exactly origin or service followed by one newline" >&2; exit 1 ;;
      esac
    fi
    printf '%s\n' "$mode" > "$RUNNER_TEMP/gate-source-mode"
  # Fetch the gate-owned tools.  origin keeps the Contents API download; service
  # prepares workflow_sha through the host client (no network from the job) and
  # reads both scripts out of the read-only mirror under a shared consume lock.
  # The client is invoked BEFORE the lock: the host writer needs the exclusive
  # side of that lock, so holding it here would deadlock.
  GATE_SOURCE_BOOTSTRAP_SCRIPT: |
    set -euo pipefail
    eval "$GATE_SOURCE_DECIDE_SCRIPT"
    mode=$(cat "$RUNNER_TEMP/gate-source-mode")
    if [ "$mode" != service ]; then
      python3 -c "import os, pathlib; p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'gate-api.hdr'; p.write_text('Authorization: Bearer ' + os.environ['GATE_GITHUB_TOKEN'] + chr(10) + 'Accept: application/vnd.github.raw' + chr(10) + 'User-Agent: gate-bounded-retry' + chr(10), encoding='ascii'); p.chmod(0o600)"
      [ -f "${RUNNER_TEMP}/gate_bounded_retry.py" ] || curl --fail -sS --retry "${GATE_NET_RETRY_ATTEMPTS}" --retry-all-errors --retry-delay "${GATE_NET_RETRY_BACKOFF_SECS%% *}" --max-time "${GATE_NET_ATTEMPT_TIMEOUT_SECS}" -H "@${RUNNER_TEMP}/gate-api.hdr" -o "${RUNNER_TEMP}/gate_bounded_retry.py" "${GITHUB_API_URL:-https://api.github.com}/repos/${GATE_CHECKOUT_REPOSITORY}/contents/scripts/gate_bounded_retry.py?ref=${GATE_CHECKOUT_REF}"
      exit 0
    fi
    repository=${GATE_CHECKOUT_REPOSITORY:?}
    commit=${GATE_CHECKOUT_REF:?}
    if [ "${#commit}" -ne 40 ] || [[ "$commit" == *[!0-9a-f]* ]]; then echo "::error::SOURCE-COMMIT-INVALID: $commit" >&2; exit 1; fi
    case "$repository" in zlxlabs/*) ;; *) echo "::error::SOURCE-REPOSITORY-REJECTED: $repository" >&2; exit 1 ;; esac
    source_root=$(realpath -e "$source_root") || { echo "::error::SOURCE-MIRROR-UNREADABLE: $source_root" >&2; exit 1; }
    budget=${GATE_SOURCE_BUDGET_SECS:-180}
    deadline=$(( $(date +%s) + budget ))
    client="$source_root/git-source-prepare"
    [ -x "$client" ] || { echo "::error::SOURCE-CLIENT-MISSING: $client" >&2; exit 1; }
    client_raw=$("$client" --repository "$repository" --commit "$commit" --deadline-epoch "$deadline" 2>&1 >/dev/null) && client_status=0 || client_status=$?
    if ! printf '%s\n' "$client_raw" | GATE_SOURCE_EXPECTED_REPOSITORY="$repository" GATE_SOURCE_EXPECTED_COMMIT="$commit" GATE_SOURCE_CLIENT_EXIT="$client_status" python3 -c '
    import json, os, sys
    marker = "GIT-SOURCE-PREPARE-V1 "
    lines = [line[len(marker):] for line in sys.stdin.read().splitlines() if line.startswith(marker)]
    try:
        if len(lines) != 1:
            raise ValueError("expected exactly one protocol line")
        payload = json.loads(lines[0])
        status = "ready" if os.environ["GATE_SOURCE_CLIENT_EXIT"] == "0" else "failed"
        if not isinstance(payload, dict) or payload.get("status") != status or payload.get("repository") != os.environ["GATE_SOURCE_EXPECTED_REPOSITORY"] or payload.get("commit_sha") != os.environ["GATE_SOURCE_EXPECTED_COMMIT"] or payload.get("source") not in ("hit", "cold"):
            raise ValueError("reply fields do not match the request")
    except (json.JSONDecodeError, ValueError):
        raise SystemExit(1)
    ' ; then
      echo "::error::SOURCE-CLIENT-CONTRACT: invalid GIT-SOURCE-PREPARE-V1 reply" >&2
      exit 1
    fi
    client_line=$(printf '%s\n' "$client_raw" | grep -m1 '^GIT-SOURCE-PREPARE-V1 ')
    [ "$client_status" -eq 0 ] || { echo "::error::SOURCE-CLIENT-FAILED: $client_line" >&2; exit 1; }
    mirror_repo="$source_root/$repository.git"
    lock_file="$mirror_repo/consume.lock"
    [ -f "$lock_file" ] || { echo "::error::SOURCE-LOCK-UNREADABLE: $lock_file" >&2; exit 1; }
    exec {source_lock_fd}<"$lock_file"
    # One budget covers the client and the lock: wait only for what is left of the
    # deadline the client was given, never for a fresh full budget.
    remaining=$(( deadline - $(date +%s) ))
    [ "$remaining" -ge 1 ] || { echo "::error::SOURCE-DEADLINE-EXCEEDED: budget $budget exhausted before the lock" >&2; exit 1; }
    flock --shared -w "$remaining" "$source_lock_fd" || { echo "::error::SOURCE-LOCK-TIMEOUT: $lock_file after ${remaining}s of a ${budget}s budget" >&2; exit 1; }
    remaining=$(( deadline - $(date +%s) ))
    [ "$remaining" -ge 1 ] || { flock --unlock "$source_lock_fd"; echo "::error::SOURCE-DEADLINE-EXCEEDED: budget $budget exhausted before reading the mirror" >&2; exit 1; }
    demand_ref="refs/demand/$commit"
    demand_commit=$(git --git-dir="$mirror_repo" rev-parse --verify --quiet "$demand_ref^{commit}") || {
      flock --unlock "$source_lock_fd"
      echo "::error::SOURCE-DEMAND-REF-MISSING: $demand_ref" >&2
      exit 1
    }
    if [ "$demand_commit" != "$commit" ]; then
      flock --unlock "$source_lock_fd"
      echo "::error::SOURCE-PIN-MISMATCH: $demand_ref resolves to $demand_commit, expected $commit" >&2
      exit 1
    fi
    for gate_script in scripts/gate_source.py scripts/gate_bounded_retry.py; do
      if ! git --git-dir="$mirror_repo" show "refs/demand/$commit:$gate_script" > "$RUNNER_TEMP/${gate_script##*/}"; then
        flock --unlock "$source_lock_fd"
        echo "::error::SOURCE-DEMAND-REF-MISSING: $gate_script at $commit" >&2
        exit 1
      fi
    done
    flock --unlock "$source_lock_fd"
  SILO_ENDPOINT: https://zlx-vm-work-i5-infra.taile9071.ts.net:9000
  SILO_BUCKET: ci-artifacts
  GATE_NET_RETRY_ATTEMPTS: "3"
  GATE_NET_RETRY_BACKOFF_SECS: "5 15"
  GATE_NET_ATTEMPT_TIMEOUT_SECS: "25"
  GATE_HTTP_LOW_SPEED_LIMIT: "1000"
  GATE_HTTP_LOW_SPEED_TIME: "20"

jobs:
  control:
    # Keep the environment so any future protection can be configured in GitHub.
    environment:
      name: gate-disposition
    # Silo is on tailnet; GitHub-hosted cannot reach 100.x. Use the ci pool
    # (same labels as quality), not ubuntu-latest.
    runs-on: [self-hosted, linux, ci]
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.SILO_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SILO_SECRET_KEY }}
      SILO_STORE: ${{ github.workspace }}/_gate-disposition-src/scripts/silo_store.py
      SILO_EXEC: ${{ github.workspace }}/_gate-disposition-src/scripts/silo_exec.sh
    steps:
      # gate#275: a caller still pinned to the legacy five inputs sends no
      # evidence at all, and the authoritative receipt rejection then lands only
      # after the Silo fetch and the canonical audit read.  Two shapes are
      # provably rejected by `issue_receipt.py` for ANY audit, so name them here,
      # before this job touches the network.  Nothing else is pre-judged: the
      # remaining input shapes (counterevidence shape, tracking issue validity,
      # deferred, finding matching) stay with the authoritative validator, whose
      # accept domain this step must not change.
      - name: Preflight disposition evidence inputs
        env:
          DISPOSITION_KIND: ${{ inputs.disposition }}
          DISPOSITION_COUNTEREVIDENCE_JSON: ${{ inputs.counterevidence_json }}
          DISPOSITION_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
        run: |
          set -euo pipefail
          hint="no disposition evidence arrived with this request. A false-positive needs counterevidence_json (a JSON object with non-empty command, output, result=refuted and pointer); a deferred needs tracking_issue. If your caller only declares the legacy five inputs (pr_number, primary_run_id, primary_run_attempt, finding_id, reason) it cannot forward any of them: expose and forward disposition, counterevidence_json and tracking_issue, then retry. An empty value here means the evidence was not sent by this request, not that the calling repository has migrated."
          # Same normalization as issue_receipt.py: an empty disposition is the
          # false-positive default there, so it is checked as false-positive here.
          kind="${DISPOSITION_KIND:-}"
          [ -n "$kind" ] || kind=false-positive
          if [ "$kind" != false-positive ] && [ "$kind" != deferred ]; then
            echo "::error::DISPOSITION_INPUT_PREFLIGHT_FAILED: disposition is '$kind', not false-positive or deferred. $hint" >&2
            exit 1
          fi
          if [ "$kind" = false-positive ] && [ -z "${DISPOSITION_COUNTEREVIDENCE_JSON:-}" ]; then
            echo "::error::DISPOSITION_INPUT_PREFLIGHT_FAILED: false-positive disposition with an empty counterevidence_json. $hint" >&2
            exit 1
          fi

      - name: Checkout disposition producer
        env:
          GATE_CHECKOUT_REPOSITORY: ${{ job.workflow_repository }}
          GATE_CHECKOUT_REF: ${{ job.workflow_sha }}
          # gate_source.checkout_from_environment refuses an empty or "." path:
          # the workspace root belongs to actions/checkout, so this entry point
          # materializes its tools in a subdirectory like every gate-v2 site does.
          GATE_CHECKOUT_PATH: _gate-disposition-src
          GATE_CHECKOUT_SPARSE: |
            .github/actions/gate-disposition/issue_receipt.py
            .github/actions/gate-aggregator/convergence.py
            scripts/silo_store.py
            scripts/silo_exec.sh
          GATE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$GATE_SOURCE_BOOTSTRAP_SCRIPT"
          python3 "${RUNNER_TEMP}/gate_bounded_retry.py" checkout

      - name: Resolve Silo hostname via MagicDNS
        run: |
          set -euo pipefail
          SILO_RESOLUTION="$(python3 "${RUNNER_TEMP}/gate_bounded_retry.py" magicdns --silo-store "$SILO_STORE" --endpoint "$SILO_ENDPOINT" --nameserver 100.100.100.100)" || {
            echo "::error::Silo MagicDNS lookup failed; see the preceding MagicDNS attempt N/M failed: line for the underlying cause. SILO_ENDPOINT=${SILO_ENDPOINT}" >&2
            exit 1
          }
          SILO_IP="${SILO_RESOLUTION%% *}"; SILO_HOST="${SILO_RESOLUTION#* }"
          if [ -z "$SILO_IP" ] || [ -z "$SILO_HOST" ] || [ "$SILO_IP" = "$SILO_RESOLUTION" ]; then
            echo "::error::Silo MagicDNS lookup failed; see the preceding MagicDNS attempt N/M failed: line for the underlying cause. SILO_ENDPOINT=${SILO_ENDPOINT}" >&2
            exit 1
          fi
          if grep -qF "$SILO_HOST" /etc/hosts; then printf 'Silo host %s already in /etc/hosts\n' "$SILO_HOST"
          elif [ "$(id -u)" -eq 0 ]; then printf '%s %s\n' "$SILO_IP" "$SILO_HOST" >> /etc/hosts
          else printf '%s %s\n' "$SILO_IP" "$SILO_HOST" | sudo tee -a /etc/hosts >/dev/null
          fi

      - name: Resolve current PR head and canonical primary audit
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PRIMARY_RUN_ID: ${{ inputs.primary_run_id }}
          PRIMARY_RUN_ATTEMPT: ${{ inputs.primary_run_attempt }}
        run: |
          set -euo pipefail
          test -n "$PRIMARY_RUN_ID"
          test -n "$PRIMARY_RUN_ATTEMPT"
          pr_json="$RUNNER_TEMP/current-pr.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$pr_json"
          jq -e --arg repo "$GITHUB_REPOSITORY" --argjson id "$GITHUB_REPOSITORY_ID" \
            '.head.sha and .base.sha and (.head.repo.full_name == $repo) and ($id > 0)' \
            "$pr_json" > /dev/null
          head_sha="$(jq -r '.head.sha' "$pr_json")"
          audit_dir="$RUNNER_TEMP/current-primary-audit"
          mkdir -p "$audit_dir"
          audit_name="primary-audit-v2-${GITHUB_REPOSITORY_ID}-${head_sha}-${PRIMARY_RUN_ID}-${PRIMARY_RUN_ATTEMPT}"
          silo_key="d14/${GITHUB_REPOSITORY_ID}/${audit_name}/primary-review-audit.json"
          dest="$audit_dir/primary-review-audit.json"
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::SILO_ACCESS_KEY 未传入" >&2; exit 1; }
          set +e
          "$SILO_EXEC" get --key "$silo_key" --dest "$dest"
          silo_rc=$?
          set -e
          if [ "$silo_rc" -eq 2 ]; then
            gh run download -R "$GITHUB_REPOSITORY" "$PRIMARY_RUN_ID" --name "$audit_name" --dir "$audit_dir"
          elif [ "$silo_rc" -ne 0 ]; then
            echo "::error::Silo get failed for canonical primary audit (exit=${silo_rc})" >&2
            exit "$silo_rc"
          fi
          audit_path="$(find "$audit_dir" -type f -name '*.json' -print -quit)"
          test -n "$audit_path"
          audit_digest="$(sha256sum "$audit_path" | cut -d' ' -f1)"
          jq -e --arg head "$head_sha" --argjson pr "$PR_NUMBER" --argjson run "$PRIMARY_RUN_ID" --argjson attempt "$PRIMARY_RUN_ATTEMPT" \
            '.head_sha == $head and (.pr == $pr or .pr_number == $pr) and .run_id == $run and .run_attempt == $attempt' "$audit_path" > /dev/null
          {
            echo "AUDIT_PATH=$audit_path"
            echo "CURRENT_PR_PATH=$pr_json"
            echo "CURRENT_HEAD_SHA=$head_sha"
            echo "CURRENT_AUDIT_DIGEST=$audit_digest"
          } >> "$GITHUB_ENV"

      - name: Construct canonical scope and derive epoch
        env:
          AUDIT_PATH: ${{ runner.temp }}/current-primary-audit/primary-review-audit.json
          PR_PATH: ${{ runner.temp }}/current-pr.json
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          scope_envelope="$(python3 - "$AUDIT_PATH" "$PR_PATH" "$REPOSITORY_ID" "$PR_NUMBER" <<'PY'
          import importlib.util
          import json
          import sys
          from pathlib import Path

          audit = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          pull = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          repository_id = int(sys.argv[3])
          pr_number = int(sys.argv[4])
          required = (
              "diff_digest", "policy_version", "policy_digest",
              "caller_sha", "reusable_workflow_sha", "base_sha", "head_sha",
          )
          missing = [field for field in required if field not in audit]
          if missing:
              raise SystemExit("canonical audit missing scope fields: " + ",".join(missing))
          base_sha = pull["base"]["sha"]
          head_sha = pull["head"]["sha"]
          if audit["base_sha"] != base_sha or audit["head_sha"] != head_sha:
              raise SystemExit("canonical audit scope disagrees with current PR base/head")
          module_path = Path("_gate-disposition-src/.github/actions/gate-aggregator/convergence.py").resolve()
          spec = importlib.util.spec_from_file_location("gate_convergence_scope", module_path)
          if spec is None or spec.loader is None:
              raise ImportError(f"convergence module is unavailable: {module_path}")
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          scope = module.Scope(
              repository_id=repository_id,
              pr_number=pr_number,
              base_sha=base_sha,
              head_sha=head_sha,
              diff_digest=audit["diff_digest"],
              policy_version=audit["policy_version"],
              policy_digest=audit["policy_digest"],
              tier=audit.get("tier") if audit.get("tier") in module.SUPPORTED_TIERS else "internal",
              caller_sha=audit["caller_sha"],
              reusable_workflow_sha=audit["reusable_workflow_sha"],
          )
          module.validate_scope(scope)
          print(json.dumps({"scope": scope.as_dict(), "epoch": module.derive_epoch(scope)}, sort_keys=True, separators=(",", ":")))
          PY
          )"
          scope_json="$(printf '%s' "$scope_envelope" | jq -c '.scope')"
          epoch="$(printf '%s' "$scope_envelope" | jq -r '.epoch')"
          echo "CURRENT_SCOPE_JSON=$scope_json" >> "$GITHUB_ENV"
          echo "CURRENT_EPOCH=$epoch" >> "$GITHUB_ENV"

      - name: Issue immutable disposition artifact
        id: disposition
        env:
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ inputs.pr_number }}
          FINDING_ID: ${{ inputs.finding_id }}
          DISPOSITION_REASON: ${{ inputs.reason }}
          DISPOSITION_KIND: ${{ inputs.disposition }}
          DISPOSITION_COUNTEREVIDENCE_JSON: ${{ inputs.counterevidence_json }}
          DISPOSITION_TRACKING_ISSUE: ${{ inputs.tracking_issue }}
          DISPOSITION_APPROVER: ${{ github.actor }}
          DISPOSITION_APPROVER_ID: ${{ github.actor_id }}
          DISPOSITION_REPOSITORY: ${{ github.repository }}
          OUTPUT_DIR: ${{ runner.temp }}/gate-disposition-artifact
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -n "$AUDIT_PATH"
          test -n "$CURRENT_HEAD_SHA"
          test -n "$CURRENT_AUDIT_DIGEST"
          test -n "$CURRENT_EPOCH"
          test -n "$DISPOSITION_APPROVER"
          test -n "$DISPOSITION_APPROVER_ID"
          approved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          output="$(python3 _gate-disposition-src/.github/actions/gate-disposition/issue_receipt.py issue \
            --output-dir "$OUTPUT_DIR" --audit-path "$AUDIT_PATH" \
            --repository-id "$REPOSITORY_ID" --pr-number "$PR_NUMBER" \
            --head-sha "$CURRENT_HEAD_SHA" --finding-id "$FINDING_ID" \
            --reason "$DISPOSITION_REASON" --scope-json "$CURRENT_SCOPE_JSON" \
            --repository "$DISPOSITION_REPOSITORY" --disposition "$DISPOSITION_KIND" \
            --counterevidence-json "$DISPOSITION_COUNTEREVIDENCE_JSON" \
            --tracking-issue "$DISPOSITION_TRACKING_ISSUE" \
            --approver "$DISPOSITION_APPROVER" \
            --approver-id "$DISPOSITION_APPROVER_ID" \
            --approved-at "$approved_at")"
          artifact_name="$(printf '%s' "$output" | jq -r '.artifact')"
          test -n "$artifact_name" && echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Upload immutable disposition artifact
        if: always() && steps.disposition.outcome == 'success'
        env:
          ARTIFACT_NAME: ${{ steps.disposition.outputs.artifact_name }}
          OUTPUT_DIR: ${{ runner.temp }}/gate-disposition-artifact
        run: |
          set -euo pipefail
          [ -n "${AWS_ACCESS_KEY_ID:-}" ] || { echo "::error::SILO_ACCESS_KEY 未传入" >&2; exit 1; }
          "$SILO_EXEC" put-dir \
            --tier d30 \
            --repo-id "${{ github.repository_id }}" \
            --name "$ARTIFACT_NAME" \
            --dir "$OUTPUT_DIR"
