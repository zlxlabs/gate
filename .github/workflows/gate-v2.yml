# Required Gate v2 (reusable workflow) — quality ∥ primary ∥ ocr → gate aggregator.
# Workspace lifecycle audit: only `quality` runs caller checks after a gate-source
# checkout; `gate` and `ledger` run gate-owned code only and keep separate source
# directories for their own control-plane steps.
#
# Stage 2 (D1 in the private gate-hub repo's
# ceo-plans/2026-07-24-shadow-review-independence.md) of the shadow-review
# independence rollout. This file implements ONLY the "Required Gate" state
# machine from that plan. Shadow Calibration is a SEPARATE workflow (D2, a
# later task, not in this file) with its OWN independent concurrency group.
#
# legacy `.github/workflows/gate.yml` is UNCHANGED by this file and continues
# to serve the existing fleet unmodified. This workflow is additive and only
# reachable via an explicit per-repo caller opt-in during canary (see
# templates/caller-gate-v2.yml) — no existing caller references this file.
#
# Job layout:
#   quality  — lint / jscpd / dependency-cruiser / tests / PR-size preflight.
#              Everything from legacy gate.yml's single job EXCEPT the model
#              review itself. Runs on the same self-hosted/hosted pool legacy
#              uses, with the same fork-PR → hosted-fallback guard.
#   primary  — runs `review-primary` (gate-hub, already merged) when the PR is
#              non-draft, same-repo (not a fork), and `runner: self`. Skips
#              the WHOLE job otherwise (draft / fork / hosted-tier) — see the
#              job's own comment for what's deliberately NOT wired up yet.
#   resolve_advisory — resolves the registry's policy.advisory reviewer list
#              before the OCR matrix is expanded. Skips with the same draft /
#              fork / hosted guard as primary.
#   ocr      — runs one `review-shadow` advisory matrix leg per resolved
#              policy.advisory reviewer and posts its non-empty comment artifact
#              to the PR. It is never a dependency of the required gate.
#   gate     — the ONLY required-check-bearing job. Job id MUST stay literally
#              `gate` (this file's `name:` is also `gate`) — that combination
#              is what keeps the existing required status check context
#              `gate / gate` unchanged (see the plan's "Required status check
#              compatibility"). `if: always()` so a skipped/failed dependency
#              can never make this job silently skip too. Validates
#              needs.quality/needs.primary + the canonical primary audit
#              artifact via the portable aggregator script in
#              .github/actions/gate-aggregator/aggregate.py, and is the only
#              job with receipt-writing authority (Step Summary +, since this
#              Stage 4 piece, one fail-open PR comment per run reusing the
#              same text — the reconciler / async-ledger parts of Stage 4
#              remain future work, not this file).
#   notify   — same fail-only Feishu notification semantics as legacy,
#              triggered by `gate` (not by quality/primary individually).
#
# Concurrency is two job-level locks, never a workflow-level group (a single
# top-level cancel-in-progress: true would kill the gate panel / ledger
# writers). quality and primary each have their own per-PR group with
# cancel-in-progress: true so a newer head supersedes stale lint/review
# without those two jobs queueing or killing each other in the same run.
# gate and ledger keep cancel-in-progress: false. OCR / advisory jobs stay
# unlocked (first-cut scope).
name: gate

on:
  workflow_call:
    inputs:
      tier:       { type: string,  default: "personal" }  # personal | internal | saas
      runner:     { type: string,  default: "self" }      # self (self-hosted) | hosted (GitHub-hosted, free minutes)
      has_ui:     { type: boolean, default: false }
      design_doc: { type: string,  default: "" }          # e.g. docs/DESIGN.md
      max_diff_lines:    { type: number, default: 4000 }   # per-review-turn diff budget
      timeout_minutes:   { type: number, default: 45 }     # `quality` job's hard timeout only (see primary_timeout_minutes)
      max_review_shards: { type: number, default: 8 }      # total large-PR coverage budget
      pr_size_warn_lines: { type: number, default: 8000 }  # strong warning; hard cap derives from the two inputs above
      # Decoupled from `timeout_minutes` (2026-07-26 tightening pass): the
      # `primary` job's own budget is unrelated to quality's lint/test time and
      # must leave headroom for review-primary to finalize (write + upload the
      # canonical audit) BEFORE GitHub's hard SIGKILL — 20 minutes of review +
      # 5 minutes of finalize reserve, per the plan's REVIEW_GATE_TIMEOUT_S /
      # REVIEW_GATE_FINALIZE_RESERVE_S budget shape. The `primary` job's first
      # step derives REVIEW_GATE_TIMEOUT_S from this input IN SHELL (GitHub
      # Actions expressions have no arithmetic operators) and fails closed if
      # a caller ever passes <= 5.
      primary_timeout_minutes: { type: number, default: 25 }
      # 控制面 runner：留空（默认）跟随 runner；github-hosted 强制控制面留在
      # GitHub-hosted，作为单仓回滚逃生舱；保留遗留 self-hosted-control 取值兼容。
      control_runner: { type: string, default: "" }  # 留空跟随 runner；github-hosted 回滚逃生舱；兼容 self-hosted-control
    secrets:
      FEISHU_CI_WEBHOOK:
        # Optional: public repos MUST pass this as a repo SECRET (fork PR runs
        # cannot read secrets — see the notify job); private repos may rely on
        # the same-name repo VARIABLE fallback instead (see notify job below).
        required: false

# Union of everything any job below needs; each caller must grant this whole
# set (reusable-workflow permission escalation otherwise fails at startup).
# actions: read   — Jobs API (resolve this run's numeric job id for the
#                    primary/OCR jobs' REVIEW_JOB_ID) + actions/download-artifact
#                    in the gate job.
# pull-requests: write — the quality job's PR-size preflight action, diff-coverage
#                    advisory, the OCR advisory job, and the gate job's Stage 4 PR-comment
#                    receipt (fail-open email-visible mirror of the Step
#                    Summary — see the gate job) post PR comments; primary
#                    never comments (Step Summary only).
permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  # ── quality ──────────────────────────────────────────────────────────────
  # Every legacy gate.yml step EXCEPT the model review chain (see "primary"
  # below). Its ledger inputs are uploaded at the end of this job so the
  # separate gate job can combine them with the primary audit without relying
  # on job-local runner.temp state.
  quality:
    # Same self-hosted/hosted fork-guard expression legacy's single `gate` job
    # uses verbatim (see legacy .github/workflows/gate.yml and
    # tests/test_gate_contract.py's FORK_GUARD): non-pull_request events
    # (reserved for a future `merge_group` trigger — see
    # templates/caller-gate-v2.yml) always get the self-hosted pool when
    # `runner: self`; pull_request events additionally require the head repo
    # to equal this repo (fork PRs degrade to the hosted, one-shot sandbox).
    # quality 走无凭据 ci 池（spec：gate-hub docs/designs/runner-ci-pool-split.md）。
    runs-on: ${{ (inputs.runner == 'self' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","ci"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    # Per-PR cancel of stale quality only. Group is independent of `primary`
    # (same-run jobs must not share a group) and of the gate/ledger writer
    # locks (those stay cancel-in-progress: false). Workflow identity prefix
    # + repository_id keep this out of other workflows' namespace
    # (zlxlabs/agent-config#68). Non-PR events fall back to run_id.
    concurrency:
      group: gate-required-v2-quality-${{ github.repository_id }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 1 }

      - name: Remove stale gate source directories
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/_gate-action-src"
          rm -rf "$GITHUB_WORKSPACE/_gate-aggregator-src"
          for path in _gate-action-src _gate-aggregator-src; do
            if [ -e "$GITHUB_WORKSPACE/$path" ]; then
              echo "::error::gate source directory still exists after cleanup: $path"
              exit 1
            fi
          done

      - name: Detect repository quality entry
        id: quality-entry
        env:
          GATE_ARTIFACT_DIR: ${{ runner.temp }}/gate-quality
        run: |
          mkdir -p "$GATE_ARTIFACT_DIR"
          if [ -e scripts/gate-quality ]; then
            if [ ! -x scripts/gate-quality ]; then
              echo "::error::scripts/gate-quality exists but is not executable"
              exit 1
            fi
            echo "mode=entry" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DEPRECATION: scripts/gate-quality is missing; using legacy quality auto-detection"
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
          fi

      # `uses:` cannot take an expression. Check out this reusable workflow's own
      # source at the exact commit selected by the caller, then invoke the action
      # through a workspace-relative path so it follows the caller's workflow pin.
      - name: Checkout gate actions at this workflow's own commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _gate-action-src
          sparse-checkout: |
            .github/actions
            scripts/scrub_outbound.py

      - name: PR size preflight
        uses: ./_gate-action-src/.github/actions/pr-size-preflight
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          max-diff-lines: ${{ inputs.max_diff_lines }}
          max-review-shards: ${{ inputs.max_review_shards }}
          warn-lines: ${{ inputs.pr_size_warn_lines }}
          token: ${{ github.token }}

      - name: Remove gate action source before caller checks
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$GITHUB_WORKSPACE/_gate-action-src"
          if [ -e "$GITHUB_WORKSPACE/_gate-action-src" ]; then
            echo "::error::gate action source directory still exists before caller checks"
            exit 1
          fi
          if [ -e "$GITHUB_WORKSPACE/_gate-aggregator-src" ]; then
            echo "::error::gate aggregator source directory exists before caller checks"
            exit 1
          fi

      - name: Run scripts/gate-quality
        if: ${{ steps.quality-entry.outputs.mode == 'entry' }}
        working-directory: ${{ github.workspace }}
        env:
          GATE_ARTIFACT_DIR: ${{ runner.temp }}/gate-quality
        run: ./scripts/gate-quality

      - name: Lint / format
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' }}
        run: |
          if [ -f Makefile ] && grep -qE '^lint:' Makefile; then make lint
          else echo "no 'lint' make target — skipping"; fi

      - name: Duplicate check (jscpd, advisory)
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' }}
        continue-on-error: true
        run: npx --yes jscpd --threshold "${JSCPD_THRESHOLD:-5}" --reporters console .

      - name: Dependency direction (dependency-cruiser)
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' }}
        run: |
          if [ -f .dependency-cruiser.js ] || [ -f .dependency-cruiser.json ]; then
            npx --yes --package=dependency-cruiser depcruise --config .dependency-cruiser.* --output-type err src
          else echo "no dependency-cruiser config — skipping (use import-linter for python)"; fi

      # L1 dependency-download cache — hosted-only path (uv cache mirrors legacy
      # verbatim; see legacy gate.yml + docs/designs/ci-cache-strategy.md for the
      # full historical rationale, unchanged here).
      - name: Restore uv download cache
        id: uv-cache
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' && inputs.runner == 'hosted' && hashFiles('uv.lock') != '' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-${{ runner.arch }}-

      # L1 dependency-download cache — self-hosted-only path (VM201 local
      # volume). Canary ring, personal tier only — same condition and
      # promotion path as legacy gate.yml (tests/test_gate_contract.py pins
      # legacy's copy; this v2 copy carries the same restriction forward).
      - name: Point package manager caches at the VM201 local cache volume (self, personal canary)
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' && inputs.runner == 'self' && inputs.tier == 'personal' }}
        run: |
          cache_root=/opt/gate-hub-cache
          echo "UV_CACHE_DIR=$cache_root/uv" >> "$GITHUB_ENV"
          echo "npm_config_cache=$cache_root/npm" >> "$GITHUB_ENV"
          echo "pnpm_config_store_dir=$cache_root/pnpm" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$cache_root/go" >> "$GITHUB_ENV"

      # D5 install-timing split — canary ring, personal tier only, same as
      # legacy gate.yml (see that file's steps for the full historical
      # rationale on ecosystem detection / continue-on-error / canary gating).
      - name: Install dependencies
        id: install
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' && inputs.tier == 'personal' }}
        continue-on-error: true
        env:
          UV_CACHE_HIT: ${{ steps.uv-cache.outputs.cache-hit }}
          INSTALL_RESULT_PATH: ${{ runner.temp }}/install-result.json
        run: |
          start=$(date +%s)
          ecosystem="none"
          status="skipped"
          if [ -f uv.lock ]; then
            ecosystem="uv"
            if uv sync --frozen; then status="ok"; else status="failed"; fi
          elif [ -f package-lock.json ]; then
            ecosystem="npm"
            if npm ci; then status="ok"; else status="failed"; fi
          elif [ -f pnpm-lock.yaml ]; then
            ecosystem="pnpm"
            if pnpm install --frozen-lockfile; then status="ok"; else status="failed"; fi
          elif [ -f go.sum ]; then
            ecosystem="go-skipped"
            echo "go.sum detected but the only registered Go repo runs tests inside an isolated docker container (host module cache unreachable) — skipping host-side predownload, see legacy gate.yml"
          else
            echo "no supported lockfile at repo root — skipping predownload"
          fi
          end=$(date +%s)
          cache_hit=null
          if [ "$ecosystem" = "uv" ]; then
            case "${UV_CACHE_HIT:-}" in
              true)  cache_hit=true ;;
              false) cache_hit=false ;;
            esac
          fi
          printf '{"ecosystem":"%s","status":"%s","duration_s":%s,"cache_hit":%s}\n' \
            "$ecosystem" "$status" "$((end - start))" "$cache_hit" | tee "$INSTALL_RESULT_PATH"
          [ "$status" != "failed" ]

      - name: Tests
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' }}
        run: |
          if   [ -f Makefile ] && grep -qE '^test:' Makefile; then make test
          elif [ -f package.json ]; then npm test --if-present
          elif [ -f pyproject.toml ]; then
            if   command -v uv >/dev/null;     then
              if [ -f uv.lock ]; then uv run --frozen pytest -q; else uv run pytest -q; fi
            elif command -v pytest >/dev/null; then pytest -q
            else echo "no python test runner on this runner — skipping (runs on self-hosted)"; fi
          else echo "no tests detected"; fi

      - name: Checkout gate actions for diff-coverage advisory
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _gate-action-src
          sparse-checkout: |
            .github/actions
            scripts/scrub_outbound.py

      - name: Diff coverage advisory
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        uses: ./_gate-action-src/.github/actions/diff-coverage-advisory
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          token: ${{ github.token }}

      - name: Prune uv cache before persistence
        if: ${{ steps.quality-entry.outputs.mode == 'legacy' && inputs.runner == 'hosted' && hashFiles('uv.lock') != '' }}
        run: uv cache prune --ci || true

      - name: Upload v2 review ledger inputs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-ledger-input-v2-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/pr-size-preflight.json
            ${{ runner.temp }}/install-result.json
          if-no-files-found: error
          retention-days: 30

  # ── primary ──────────────────────────────────────────────────────────────
  # Runs review-primary (gate-hub, already merged) and writes+uploads the ONE
  # canonical primary audit the `gate` aggregator consumes. Deliberately does
  # NOT implement (this PR, D1 scope only):
  #   - the `codex-review-waived` label / waiver-comment validation legacy's
  #     "Validate audited Codex review waiver" step does. As of the
  #     2026-07-26 security tightening pass, the aggregator UNCONDITIONALLY
  #     REJECTS any not_expected/waived audit verdict it ever sees (see
  #     .github/actions/gate-aggregator/aggregate.py's module docstring, "T6")
  #     — a later PR that wires up a real waiver-writing branch here MUST
  #     also implement gate-hub contracts.py-equivalent companion-field
  #     policy validation in the aggregator (enum-domain / ISO-8601 checks,
  #     not merely "field is present") before flipping that rejection to an
  #     acceptance;
  #   - a not_expected canonical-audit WRITE for the fork/hosted skip branches
  #     below (the plan's Required Gate section calls for one; this canary PR
  #     leaves the whole job skipped instead and relies on the aggregator's
  #     `review_expected` check to accept the skip — tracked as a TODO, not a
  #     silent gap: see this PR's report; T3 in the fleet-promotion checklist).
  primary:
    # Whole-job skip (clean `skipped` conclusion, not a same-verdict "success
    # with nothing done") whenever review should not run at all: draft PR,
    # fork PR (head repo != this repo), or `runner: hosted`. The `gate`
    # aggregator recomputes this SAME expression (as `REVIEW_EXPECTED`, see
    # the `gate` job below) to decide whether a `skipped` result is an
    # accepted no-op or a fail-closed anomaly — tests/test_gate_v2_contract.py
    # pins that both copies stay identical.
    if: ${{ github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository && inputs.runner == 'self' }}
    # Defense in depth (belt-and-suspenders, same rationale as legacy's
    # runs-on ternary + per-step `if` pair — see legacy gate.yml's fork-PR
    # protection comment): even if the `if:` above were ever weakened by a
    # future edit, a fork PR still can never land on the self-hosted pool.
    runs-on: ${{ (inputs.runner == 'self' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","codex"]') || fromJSON('["ubuntu-latest"]') }}
    # Decoupled from quality's `timeout_minutes` — see that input's comment.
    timeout-minutes: ${{ inputs.primary_timeout_minutes }}
    # Per-PR cancel of stale primary only. Own group (not shared with
    # quality) so one run's lint and review never queue or kill each other.
    concurrency:
      group: gate-required-v2-primary-${{ github.repository_id }}-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 1 }

      - name: Compute and validate review-primary's internal timeout budget
        # GitHub Actions expression syntax has NO arithmetic operators (the
        # official Operators table is limited to grouping/index/property/
        # comparison/logical operators — no `+ - * / %`); a `${{ (x - 5) * 60
        # }}`-style expression fails workflow parsing outright (confirmed
        # against GitHub's own Contexts/Expressions reference docs after an
        # earlier draft of this file wrongly assumed arithmetic was
        # supported). The only correct way to derive REVIEW_GATE_TIMEOUT_S
        # from primary_timeout_minutes is a plain shell computation here,
        # then export it via $GITHUB_ENV for every later step in this job
        # (including "Run review-primary" below, which no longer needs its
        # own copy). Interpolating `inputs.primary_timeout_minutes` directly
        # into the shell script is safe: it is a `number`-typed input the
        # CALLER sets (not attacker-controlled PR content), so GitHub always
        # substitutes a bare numeric literal here, never arbitrary text.
        run: |
          set -euo pipefail
          primary_timeout_minutes=${{ inputs.primary_timeout_minutes }}
          # Fail-closed lower bound: the fixed 5-minute finalize reserve
          # (write + upload the canonical audit) must leave a POSITIVE
          # review budget — primary_timeout_minutes <= 5 would make
          # REVIEW_GATE_TIMEOUT_S zero or negative, which is nonsensical.
          if [ "$primary_timeout_minutes" -le 5 ]; then
            echo "::error::primary_timeout_minutes must be > 5 (5 minutes are reserved for review-primary to finalize before GitHub's hard job timeout); got $primary_timeout_minutes"
            exit 1
          fi
          review_gate_timeout_s=$(( (primary_timeout_minutes - 5) * 60 ))
          echo "REVIEW_GATE_TIMEOUT_S=$review_gate_timeout_s" >> "$GITHUB_ENV"

      - name: Resolve numeric job id for REVIEW_JOB_ID
        # review-primary requires REVIEW_JOB_ID (a net-new v2 identity field —
        # GitHub Actions has no standard env var exposing a job's own numeric
        # id). Query THIS run's exact attempt so a rerun never picks up a
        # stale job id from an earlier attempt, and match by this job's own
        # `github.job` id — for a called reusable-workflow job the Jobs API
        # `name` field is typically "<caller job name> / <this job id>", so
        # match on a suffix rather than requiring an exact equality.
        id: resolve-job-id
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          job_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs" \
            --paginate --jq '.jobs[] | select(.name == "${{ github.job }}" or (.name | endswith("/ ${{ github.job }}"))) | .id' \
            | head -n1)"
          if [ -z "$job_id" ]; then
            echo "::error::could not resolve a numeric job id for job '${{ github.job }}' via the Jobs API"
            exit 1
          fi
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Run review-primary
        env:
          DESIGN_DOC: ${{ inputs.design_doc }}
          GATE_TIER: ${{ inputs.tier }}
          MAX_DIFF_LINES: ${{ inputs.max_diff_lines }}
          MAX_REVIEW_SHARDS: ${{ inputs.max_review_shards }}
          REVIEW_PRIMARY_AUDIT_PATH: ${{ runner.temp }}/primary-review-audit.json
          REVIEW_JOB_ID: ${{ steps.resolve-job-id.outputs.job_id }}
          REVIEW_RUN_MODE: PAYLOAD_ONLY
          # github.workflow_sha = the commit SHA of the CALLING (top-level,
          # per-repo caller) workflow file — the `github` context is always
          # associated with the caller, even inside a called reusable
          # workflow's jobs. job.workflow_sha (a SEPARATE `job` context, not a
          # `github.*` property — verified against GitHub's Contexts
          # reference doc; there is no such thing as `github.job_workflow_sha`)
          # is the commit SHA of THIS reusable workflow file for this job —
          # the two differ whenever the caller pins gate-v2.yml to an
          # older/newer SHA than its own caller file's latest commit. See
          # review-primary's docstring for the identical REVIEW_CALLER_SHA/
          # REVIEW_REUSABLE_WORKFLOW_SHA distinction.
          REVIEW_CALLER_SHA: ${{ github.workflow_sha }}
          REVIEW_REUSABLE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          # REVIEW_GATE_TIMEOUT_S is intentionally NOT set here — the
          # "Compute and validate review-primary's internal timeout budget"
          # step above already exported it via $GITHUB_ENV, which makes it
          # part of this job's process environment for every subsequent step
          # automatically (no per-step `env:` re-declaration needed).
          GH_TOKEN: ${{ github.token }}
        # P0 fix (2026-07-26, canary probe #2): review-primary is a Python entry point
        # (`#!/usr/bin/env python3` shebang, gate-hub's own scripts/review/review-primary)
        # — NOT a bash script the way legacy's scripts/codex-review.sh is. An earlier
        # draft of this line copied legacy's `bash "$GATE_HUB_DIR/..."` invocation
        # pattern verbatim, which fed review-primary's Python source to bash instead of
        # python3: confirmed in canary logs as `review-primary: line 78: syntax error
        # near unexpected token ')'` (bash choking on Python syntax) — and, as a direct
        # downstream consequence, `fatal: cannot change to 'GATE_HUB_DIR': No such file
        # or directory` (bash's command-substitution backticks trigger on
        # review-primary's OWN module docstring prose — e.g. "default `git -C
        # GATE_HUB_DIR rev-parse HEAD`", markdown-style example text inside gate-hub's
        # script, never meant to execute — the instant bash parses that whole Python
        # file as script text, since bash has no concept of a Python triple-quoted
        # string). Explicit `python3`
        # (rather than relying on the shebang + the file's executable bit, which this
        # invocation should not have to gamble on) is the fix; it also makes the
        # `git -C GATE_HUB_DIR` artifact disappear on its own, since python3 correctly
        # treats that text as an inert string literal instead of shell source.
        run: python3 "${GATE_HUB_DIR:-/opt/gate-hub}/scripts/review/review-primary" "${{ github.event.pull_request.number }}"

      - name: Upload canonical primary audit
        # Fail-closed by design: if the audit can't be uploaded, the aggregator
        # must never see a "success" primary job without a matching artifact
        # to validate — so this step deliberately has NO `continue-on-error`.
        # P1 fix (2026-07-26, canary probe #2): an earlier draft of this step relied on
        # actions/upload-artifact v4's DEFAULT `if-no-files-found` behavior, which is
        # `warn` — NOT `ignore`, but also NOT `error`: canary observed primary fail to
        # write an audit at all, yet this step still concluded `success` (a warning
        # annotation, not a job failure). `if-no-files-found: error` below is the actual
        # fail-closed setting; "no if-no-files-found: ignore" alone was never sufficient.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: primary-audit-v2-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/primary-review-audit.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload primary review diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: primary-review-diagnostics-v2-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/primary-review-diagnostics/
          if-no-files-found: ignore
          retention-days: 30

  # ── resolve_advisory (policy list before OCR matrix expansion) ──────────
  resolve_advisory:
    # Same primary-shaped guard as `primary`: draft/fork/hosted callers must
    # skip the advisory path before any reviewer job can be created.
    if: ${{ github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository && inputs.runner == 'self' }}
    # Same self-hosted/fork guard as `primary`. The hosted fallback is kept for
    # defense in depth, although this job-level `if:` prevents it in normal
    # execution and the registry is supplied by the self-hosted image.
    runs-on: ${{ (inputs.runner == 'self' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","codex"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      # Never emit [] while this job runs: GitHub Actions rejects an empty
      # matrix vector before the downstream job-level if can skip it.
      advisory_reviewers: ${{ steps.resolve-policy.outputs.advisory_reviewers }}
      has_advisory: ${{ steps.resolve-policy.outputs.has_advisory }}
    steps:
      # No checkout: policy resolution uses the trusted registry baked into
      # GATE_HUB_DIR, matching gate-shadow-v2.yml's resolver contract.
      - name: Resolve advisory reviewer list from policy
        id: resolve-policy
        env:
          GATE_TIER: ${{ inputs.tier }}
        run: |
          set -euo pipefail
          gate_hub_dir="${GATE_HUB_DIR:-/opt/gate-hub}"
          registry_file="${REVIEW_REGISTRY_FILE:-$gate_hub_dir/registry.yaml}"
          policy_json="$(python3 "$gate_hub_dir/scripts/review/resolve_policy.py" "$registry_file" "${{ github.repository }}")"
          filter_script="${RUNNER_TEMP:-/tmp}/resolve-advisory-filter.py"
          cat > "$filter_script" <<'PYEOF'
          import json
          import re
          import sys

          SAFE_NAME_RE = re.compile(r"^[a-z][a-z0-9_-]*$")
          SENTINEL = "__none__"

          policy = json.loads(sys.argv[1])
          advisory = policy["advisory"]
          for name in advisory:
              if not isinstance(name, str) or not SAFE_NAME_RE.match(name):
                  print(
                      f"::error::resolve_policy returned an unsafe advisory reviewer name "
                      f"{name!r} (must match {SAFE_NAME_RE.pattern!r})",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          has_advisory = bool(advisory)
          reviewers = advisory if has_advisory else [SENTINEL]
          print(f"advisory_reviewers={json.dumps(reviewers)}")
          print(f"has_advisory={str(has_advisory).lower()}")
          PYEOF
          python3 "$filter_script" "$policy_json" >> "$GITHUB_OUTPUT"

  # ── ocr (advisory matrix; never gates `gate`) ────────────────────────────
  ocr:
    needs: resolve_advisory
    permissions:
      actions: read
      contents: read
      pull-requests: write
    # The resolved policy list is the only reviewer source. When it is empty,
    # this job is skipped before runs-on is evaluated, so no self-hosted OCR
    # runner is allocated. The sentinel only keeps matrix expansion valid.
    if: needs.resolve_advisory.result == 'success' && needs.resolve_advisory.outputs.has_advisory == 'true'
    strategy:
      fail-fast: false
      matrix:
        reviewer: ${{ fromJSON(needs.resolve_advisory.outputs.advisory_reviewers || '["__none__"]') }}
    # Same self-hosted/fork guard as `primary` and `resolve_advisory`.
    runs-on: ${{ (inputs.runner == 'self' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","linux","codex"]') || fromJSON('["ubuntu-latest"]') }}
    # review-shadow's own default internal budget is 780s; this leaves headroom
    # for checkout, Jobs API lookup, event upload, and PR comment persistence.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: matrix.reviewer != '__none__'
        with: { fetch-depth: 1 }

      - name: Resolve numeric job id for REVIEW_JOB_ID
        if: matrix.reviewer != '__none__'
        id: resolve-job-id
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWER: ${{ matrix.reviewer }}
          OCR_GITHUB_TIMEOUT_SECONDS: 15
        run: |
          set -euo pipefail
          gh_api() {
            timeout --foreground "${OCR_GITHUB_TIMEOUT_SECONDS}s" gh api "$@"
          }
          JOB_NAME_SUFFIX="${{ github.job }} ($REVIEWER)"
          if [ -z "${REVIEWER}" ]; then
            echo "::error::resolve-job-id: matching name is empty because REVIEWER is unset"
            exit 1
          fi
          if [ -z "${{ github.job }}" ]; then
            echo "::error::resolve-job-id: matching name is empty because github.job is unset"
            exit 1
          fi
          jobs_api="repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}/jobs"
          rc=0
          api_json="$(gh_api "$jobs_api" --paginate)" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::resolve-job-id: Jobs API call failed for ${jobs_api} (exit=${rc})"
            exit 1
          fi
          if [ -z "$api_json" ]; then
            echo "::error::resolve-job-id: Jobs API returned empty body for ${jobs_api}"
            exit 1
          fi
          MAX_CANDIDATE_NAMES=50
          job_id="$(printf '%s' "$api_json" | jq -r --arg suffix "$JOB_NAME_SUFFIX" '
            first(.jobs[] | select(.name == $suffix or (.name | endswith("/ " + $suffix))) | .id) // empty
          ')"
          if [ -z "$job_id" ]; then
            candidate_info="$(printf '%s' "$api_json" | jq -r --argjson limit "$MAX_CANDIDATE_NAMES" '
              (.jobs | length) as $total |
              ([.jobs[].name][:$limit] | join(", ")) as $shown |
              if $total > $limit then
                "candidate job names (showing first \($limit) of \($total)): \($shown) ... truncated"
              else
                "candidate job names (\($total)): \($shown)"
              end
            ')"
            echo "::error::resolve-job-id: no matching job for JOB_NAME_SUFFIX='${JOB_NAME_SUFFIX}' (${candidate_info})"
            exit 1
          fi
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"

      - name: Run OCR advisory review
        if: matrix.reviewer != '__none__'
        env:
          DESIGN_DOC: ${{ inputs.design_doc }}
          GATE_TIER: ${{ inputs.tier }}
          MAX_DIFF_LINES: ${{ inputs.max_diff_lines }}
          MAX_REVIEW_SHARDS: ${{ inputs.max_review_shards }}
          REVIEW_JOB_ID: ${{ steps.resolve-job-id.outputs.job_id }}
          REVIEW_RUN_MODE: PAYLOAD_ONLY
          REVIEW_CALLER_SHA: ${{ github.workflow_sha }}
          REVIEW_REUSABLE_WORKFLOW_SHA: ${{ job.workflow_sha }}
          REVIEW_SHADOW_ROLE: advisory
          REVIEW_SHADOW_EVENT_DIR: ${{ runner.temp }}/shadow-events
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ matrix.reviewer }}
        run: python3 "${GATE_HUB_DIR:-/opt/gate-hub}/scripts/review/review-shadow" "$PR_NUMBER" "$REVIEWER"

      - name: Checkout outbound scrub at this workflow's own commit
        if: always() && matrix.reviewer != '__none__'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _gate-scrub-src
          sparse-checkout: scripts/scrub_outbound.py

      - name: Post advisory PR comment
        if: always() && matrix.reviewer != '__none__'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEWER: ${{ matrix.reviewer }}
          REVIEW_SHADOW_EVENT_DIR: ${{ runner.temp }}/shadow-events
          OCR_GITHUB_TIMEOUT_SECONDS: 15
          OCR_PUBLISH_BUDGET_SECONDS: 120
        run: |
          set -euo pipefail
          append_scrubbed_summary() {
            python3 "_gate-scrub-src/scripts/scrub_outbound.py"
          }
          comment_path="$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-comment-${REVIEWER}.md"
          if [ ! -f "$comment_path" ]; then
            echo "::error::advisory comment file missing: $comment_path"
            exit 1
          fi
          if [ ! -s "$comment_path" ]; then
            echo "advisory comment is empty; skipping PR comment"
            exit 0
          fi
          marker="<!-- gate-v2-ocr-advisory:${REVIEWER}:v1 -->"
          raw_body_path="$REVIEW_SHADOW_EVENT_DIR/advisory-sticky-${REVIEWER}.raw.md"
          body_path="$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-sticky-${REVIEWER}.md"
          payload_path="$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-sticky-${REVIEWER}.json"
          { printf '%s\n\n' "$marker"; cat "$comment_path"; } > "$raw_body_path"
          python3 "_gate-scrub-src/scripts/scrub_outbound.py" < "$raw_body_path" > "$body_path"
          if [ ! -s "$body_path" ]; then
            echo "::error::outbound scrub produced an empty advisory comment"
            exit 1
          fi
          rm "$raw_body_path" "$comment_path"
          jq -n --rawfile body "$body_path" '{body: $body}' | python3 "_gate-scrub-src/scripts/scrub_outbound.py" > "$payload_path" || exit 1

          publish_deadline_ms=$(( $(date +%s%3N) + OCR_PUBLISH_BUDGET_SECONDS * 1000 ))
          gh_api() {
            local remaining_ms request_timeout_ms
            remaining_ms=$(( publish_deadline_ms - $(date +%s%3N) ))
            if [ "$remaining_ms" -le 0 ]; then
              return 124
            fi
            request_timeout_ms=$(( OCR_GITHUB_TIMEOUT_SECONDS * 1000 ))
            if [ "$request_timeout_ms" -gt "$remaining_ms" ]; then
              request_timeout_ms="$remaining_ms"
            fi
            timeout --foreground "${request_timeout_ms}ms" gh api "$@"
            local status=$?
            if [ "$(( publish_deadline_ms - $(date +%s%3N) ))" -le 0 ]; then
              return 124
            fi
            return "$status"
          }

          set +e
          export MARKER="$marker"
          identity_source="user_api"
          identity_output="$(gh_api user 2>&1)"
          identity_status=$?
          if [ "$identity_status" -ne 0 ]; then
            http_status="$(printf '%s\n' "$identity_output" | sed -nE 's/.*HTTP ([0-9]{3}).*/\1/p' | head -n1)"
            [ -n "$http_status" ] || http_status="unavailable"
            case "$http_status" in
              403|404)
                workflow_id=41898282
                workflow_login='github-actions[bot]'
                identity_source="actions_bot_fallback"
                ;;
              *)
                jq -n --arg http_status "$http_status" \
                  '{schema_version: 1, kind: "gate_v2_ocr_advisory_delivery", reviewer: env.REVIEWER, delivery: "not_created", operation: "IDENTITY", http_status: $http_status, identity_source: null, permission_category: "permission_or_rate_limit"}' \
                  | python3 "_gate-scrub-src/scripts/scrub_outbound.py" > "$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-delivery-${REVIEWER}.json" || exit 1
                printf '%s\n' "### OCR advisory sticky delivery diagnostic" "" "- Delivery: not_created" "- HTTP status: $http_status" "- Permission category: permission_or_rate_limit" "- Reason: workflow_identity_lookup_failed" | append_scrubbed_summary >> "$GITHUB_STEP_SUMMARY" || exit 1
                echo "::warning::OCR advisory sticky identity lookup failed; HTTP status=$http_status; permission category=permission_or_rate_limit"
                exit 0
                ;;
            esac
          else
            workflow_id="$(printf '%s\n' "$identity_output" | jq -er '.id | select(type == "number" and floor == .)')"
            workflow_id_status=$?
            workflow_login="$(printf '%s\n' "$identity_output" | jq -er '.login | select(type == "string" and length > 0)')"
            workflow_login_status=$?
            if [ "$workflow_id_status" -ne 0 ] || [ "$workflow_login_status" -ne 0 ]; then
              jq -n '{schema_version: 1, kind: "gate_v2_ocr_advisory_delivery", reviewer: env.REVIEWER, delivery: "not_created", operation: "IDENTITY", http_status: null, identity_source: null, permission_category: "configuration"}' \
              | python3 "_gate-scrub-src/scripts/scrub_outbound.py" > "$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-delivery-${REVIEWER}.json" || exit 1
              printf '%s\n' "### OCR advisory sticky delivery diagnostic" "" "- Delivery: not_created" "- HTTP status: unavailable" "- Permission category: configuration" "- Reason: workflow_identity_invalid" | append_scrubbed_summary >> "$GITHUB_STEP_SUMMARY" || exit 1
              echo "::warning::OCR advisory sticky identity response was invalid"
              exit 0
            fi
          fi
          export WORKFLOW_ID="$workflow_id" WORKFLOW_LOGIN="$workflow_login" IDENTITY_SOURCE="$identity_source"
          list_own_comments() {
            gh_api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" |
              jq -c --arg marker "$MARKER" --arg login "$WORKFLOW_LOGIN" --argjson owner_id "$WORKFLOW_ID" \
                '(add // []) | map(select((.body // "") | contains($marker)) | select((((.user.id // null) != null) and (.user.id == $owner_id)) or (((.user.id // null) == null) and ((.user.login // "") == $login)))) | sort_by([(.created_at // ""), (.id // 0)])'
          }
          lookup_output="$(list_own_comments 2>&1)"
          lookup_status=$?
          if [ "$lookup_status" -ne 0 ]; then
            http_status="$(printf '%s\n' "$lookup_output" | sed -nE 's/.*HTTP ([0-9]{3}).*/\1/p' | head -n1)"
            [ -n "$http_status" ] || http_status="unavailable"
            permission_category="network_error"
            case "$http_status" in 401|403|429) permission_category="permission_or_rate_limit";; 5[0-9][0-9]) permission_category="server_error";; esac
            jq -n --arg delivery "not_created" --arg operation "LOOKUP" --arg http_status "$http_status" --arg permission_category "$permission_category" --arg identity_source "$IDENTITY_SOURCE" \
              '{schema_version: 1, kind: "gate_v2_ocr_advisory_delivery", reviewer: env.REVIEWER, delivery: $delivery, operation: $operation, http_status: $http_status, identity_source: $identity_source, permission_category: $permission_category}' \
              | python3 "_gate-scrub-src/scripts/scrub_outbound.py" > "$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-delivery-${REVIEWER}.json" || exit 1
            printf '%s\n' "### OCR advisory sticky delivery diagnostic" "" "- Delivery: not_created" "- HTTP status: $http_status" "- Permission category: $permission_category" | append_scrubbed_summary >> "$GITHUB_STEP_SUMMARY" || exit 1
            echo "::warning::OCR advisory sticky lookup failed; HTTP status=$http_status; permission category=$permission_category"
            exit 0
          fi
          comment_id="$(printf '%s\n' "$lookup_output" | jq -r '.[0].id // empty')"
          self_heal_error=""
          if [ -n "$comment_id" ]; then
            operation="PATCH"
            publish_output="$(gh_api "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --method PATCH --input "$payload_path" 2>&1)"
          else
            operation="POST"
            publish_output="$(gh_api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --method POST --input "$payload_path" 2>&1)"
          fi
          publish_status=$?
          if [ "$publish_status" -ne 0 ]; then
            http_status="$(printf '%s\n' "$publish_output" | sed -nE 's/.*HTTP ([0-9]{3}).*/\1/p' | head -n1)"
            [ -n "$http_status" ] || http_status="unavailable"
            permission_category="network_error"
            case "$http_status" in 401|403|429) permission_category="permission_or_rate_limit";; 5[0-9][0-9]) permission_category="server_error";; esac
            jq -n --arg delivery "not_created" --arg operation "$operation" --arg http_status "$http_status" --arg permission_category "$permission_category" --arg identity_source "$IDENTITY_SOURCE" \
              '{schema_version: 1, kind: "gate_v2_ocr_advisory_delivery", reviewer: env.REVIEWER, delivery: $delivery, operation: $operation, http_status: $http_status, identity_source: $identity_source, permission_category: $permission_category}' \
              | python3 "_gate-scrub-src/scripts/scrub_outbound.py" > "$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-delivery-${REVIEWER}.json" || exit 1
            printf '%s\n' "### OCR advisory sticky delivery diagnostic" "" "- Delivery: not_created" "- HTTP status: $http_status" "- Permission category: $permission_category" "- Operation: $operation" | append_scrubbed_summary >> "$GITHUB_STEP_SUMMARY" || exit 1
            echo "::warning::OCR advisory sticky $operation failed; HTTP status=$http_status; permission category=$permission_category"
            exit 0
          fi
          if [ "$operation" = "PATCH" ]; then
            duplicate_ids="$(printf '%s\n' "$lookup_output" | jq -r '.[1:][]?.id')"
            while IFS= read -r duplicate_id; do
              [ -n "$duplicate_id" ] || continue
              delete_output="$(gh_api "repos/$GITHUB_REPOSITORY/issues/comments/$duplicate_id" --method DELETE 2>&1)"
              delete_status=$?
              if [ "$delete_status" -ne 0 ]; then
                self_heal_error="comment $duplicate_id delete failed: $delete_output"
              fi
            done <<< "$duplicate_ids"
          else
            after_post="$(list_own_comments 2>&1)"
            after_status=$?
            if [ "$after_status" -ne 0 ]; then
              self_heal_error="post verification failed: $after_post"
            else
              winner_id="$(printf '%s\n' "$after_post" | jq -r '.[0].id // empty')"
              if [ -n "$winner_id" ]; then
                heal_output="$(gh_api "repos/$GITHUB_REPOSITORY/issues/comments/$winner_id" --method PATCH --input "$payload_path" 2>&1)"
                heal_status=$?
                if [ "$heal_status" -ne 0 ]; then
                  self_heal_error="post winner PATCH failed: $heal_output"
                else
                  duplicate_ids="$(printf '%s\n' "$after_post" | jq -r '.[1:][]?.id')"
                  while IFS= read -r duplicate_id; do
                    [ -n "$duplicate_id" ] || continue
                    delete_output="$(gh_api "repos/$GITHUB_REPOSITORY/issues/comments/$duplicate_id" --method DELETE 2>&1)"
                    delete_status=$?
                    if [ "$delete_status" -ne 0 ]; then
                      self_heal_error="comment $duplicate_id delete failed: $delete_output"
                    fi
                  done <<< "$duplicate_ids"
                fi
              else
                self_heal_error="post verification returned no own marker"
              fi
            fi
          fi
          delivery="updated"
          if [ "$operation" = "POST" ]; then
            delivery="created"
          fi
          jq -n --arg delivery "$delivery" --arg operation "$operation" --arg identity_source "$IDENTITY_SOURCE" --arg self_heal_error "$self_heal_error" \
            '{schema_version: 1, kind: "gate_v2_ocr_advisory_delivery", reviewer: env.REVIEWER, delivery: $delivery, operation: $operation, http_status: null, identity_source: $identity_source, permission_category: null, self_heal_error: (if $self_heal_error == "" then null else $self_heal_error end)}' \
            | python3 "_gate-scrub-src/scripts/scrub_outbound.py" > "$REVIEW_SHADOW_EVENT_DIR/advisory/advisory-delivery-${REVIEWER}.json" || exit 1
          if [ -n "$self_heal_error" ]; then
            printf '%s\n' "" "- Self-heal: $self_heal_error" | append_scrubbed_summary >> "$GITHUB_STEP_SUMMARY" || exit 1
            echo "::warning::OCR advisory sticky self-heal was partial: $self_heal_error"
          fi
          echo "OCR advisory sticky $operation succeeded for reviewer $REVIEWER"

      - name: Upload advisory review event
        if: always() && matrix.reviewer != '__none__'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: advisory-event-${{ matrix.reviewer }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shadow-events/advisory
          if-no-files-found: error
          retention-days: 30

  # ── gate (final aggregator — required check) ────────────────────────────
  gate:
    needs: [quality, primary]
    # always(): an aggregator gated by the default `success()` would itself be
    # skipped whenever a dependency fails/is skipped, and GitHub treats a
    # skipped required job as a passing check — exactly the hole the plan's
    # Required Gate section calls out. This job must always run and compute
    # its own verdict from needs.*.result instead of relying on GitHub's
    # default dependency semantics.
    if: always()
    concurrency:
      group: gate-required-v2-panel-${{ github.repository_id }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # 控制面默认跟随 runner 走自建：hosted 因账单预算硬断不可用的实测概率高于
    # 自建机群整体不可用概率，2026-07-27 已造成全组织停摆；v1 已经如此路由，
    # 本次只是补齐未完成灰度。取整税数据：2026-08-01 单日 145 计费分钟 / 12.8 实际分钟。
    runs-on: ${{ (inputs.runner == 'self' && inputs.control_runner != 'github-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","codex"]') || fromJSON('["ubuntu-latest"]') }}
    # 8 minutes: aggregation is seconds, publish is capped at <=2 minutes,
    # and the remaining time covers artifact download/upload and runner jitter.
    timeout-minutes: 8
    steps:
      # `uses:` cannot itself take an expression, so the only way to pin the
      # aggregator script to the EXACT commit this reusable workflow file is
      # currently running from (whatever SHA a canary caller pinned for
      # gate-v2.yml) is to check that ref out explicitly here and invoke the
      # checked-out file directly in the next step — see aggregate.py's module
      # docstring for why there is no `action.yml` composite-action wrapper.
      # job.workflow_repository/job.workflow_sha (the `job` context, distinct
      # from `github.*`) are GitHub's own documented mechanism for exactly
      # this "reusable workflow checks out its own source" case (Contexts
      # reference, "Example usage of job context workflow identity").
      - name: Checkout gate-aggregator at this workflow's own commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _gate-aggregator-src

      - name: Resolve canonical primary audit artifact
        id: resolve-audit-artifact
        if: ${{ needs.primary.result != 'skipped' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
          AUDIT_PREFIX: primary-audit-v2-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-
        run: |
          set -euo pipefail
          # Empty outputs keep the best-effort path fail-closed when the REST lookup fails or finds no candidate.
          echo "artifact_id=" >> "$GITHUB_OUTPUT"
          echo "source_attempt=" >> "$GITHUB_OUTPUT"
          echo "artifact_name=" >> "$GITHUB_OUTPUT"
          artifact_listing="$(mktemp)"
          trap 'rm -f "$artifact_listing"' EXIT
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --slurp > "$artifact_listing"
          selected="$(python3 - "$artifact_listing" "$AUDIT_PREFIX" "$CURRENT_ATTEMPT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          listing_path, prefix, current_attempt_text = sys.argv[1:]
          current_attempt = int(current_attempt_text)
          payload = json.loads(Path(listing_path).read_text(encoding="utf-8"))
          pages = payload if isinstance(payload, list) else [payload]
          candidates = []
          for page in pages:
              if isinstance(page, dict):
                  artifacts = page.get("artifacts", [])
              elif isinstance(page, list):
                  artifacts = page
              else:
                  artifacts = []
              for artifact in artifacts:
                  if not isinstance(artifact, dict) or artifact.get("expired") is True:
                      continue
                  name = artifact.get("name")
                  if not isinstance(name, str) or not name.startswith(prefix):
                      continue
                  suffix = name[len(prefix):]
                  if not re.fullmatch(r"[0-9]+", suffix):
                      continue
                  attempt = int(suffix)
                  if attempt <= current_attempt:
                      artifact_id = artifact.get("id")
                      if isinstance(artifact_id, int) and not isinstance(artifact_id, bool):
                          candidates.append((attempt, artifact_id, name))
          if not candidates:
              print("No matching canonical primary audit artifact found", file=sys.stderr)
              raise SystemExit(0)
          attempt, artifact_id, name = max(candidates, key=lambda candidate: candidate[0])
          print(f"{artifact_id}\t{attempt}\t{name}")
          PY
          )"
          if [ -z "$selected" ]; then
            exit 0
          fi
          IFS=$'\t' read -r artifact_id source_attempt artifact_name <<< "$selected"
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "source_attempt=$source_attempt" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Download canonical primary audit (best effort — may not exist)
        if: ${{ needs.primary.result != 'skipped' && steps.resolve-audit-artifact.outputs.artifact_id != '' }}
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.resolve-audit-artifact.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/primary-audit

      - name: Aggregate required verdict
        id: aggregate-required-verdict
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PRIMARY_RESULT: ${{ needs.primary.result }}
          # Forwarded so the aggregator can strictly validate it itself
          # (self|hosted only) — a typo here must fail closed, not silently
          # fall through whichever branch it happens to resemble.
          RUNNER_MODE: ${{ inputs.runner }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          # The SAME expression the `primary` job's own `if:` uses (see that
          # job's comment) — recomputed here because a skipped job's `if:`
          # condition is not itself exposed via `needs.*`, only its `result`.
          # tests/test_gate_v2_contract.py pins these two copies identical.
          REVIEW_EXPECTED: ${{ github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository && inputs.runner == 'self' }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUDIT_SOURCE_ATTEMPT: ${{ steps.resolve-audit-artifact.outputs.source_attempt }}
          AUDIT_ARTIFACT_NAME: ${{ steps.resolve-audit-artifact.outputs.artifact_name }}
          TERMINAL_PATH: ${{ runner.temp }}/gate-terminal.json
          CONVERGENCE_RECEIPT_PATH: ${{ runner.temp }}/convergence-receipt/convergence-receipt.json
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 _gate-aggregator-src/.github/actions/gate-aggregator/aggregate.py \
            --quality-result "$QUALITY_RESULT" \
            --primary-result "$PRIMARY_RESULT" \
            --runner "$RUNNER_MODE" \
            --is-draft "$IS_DRAFT" \
            --review-expected "$REVIEW_EXPECTED" \
            --repository-id "$REPOSITORY_ID" \
            --repository "$REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --pr-number "$PR_NUMBER" \
            --audit-source-attempt "$AUDIT_SOURCE_ATTEMPT" \
            --audit-artifact-name "$AUDIT_ARTIFACT_NAME" \
            --audit-dir "${{ runner.temp }}/primary-audit" \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --terminal-path "$TERMINAL_PATH" \
            --convergence-receipt-path "$CONVERGENCE_RECEIPT_PATH"
          rc=$?
          set -e
          if [ -f "$CONVERGENCE_RECEIPT_PATH" ]; then
            echo "convergence-receipt=present" >> "$GITHUB_OUTPUT"
          else
            echo "convergence-receipt=absent" >> "$GITHUB_OUTPUT"
          fi
          exit "$rc"

      - name: Upload convergence receipt
        if: always() && steps.aggregate-required-verdict.outputs.convergence-receipt == 'present'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-convergence-receipt-v1-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/convergence-receipt
          if-no-files-found: error
          retention-days: 30

      - name: Upload gate terminal envelope
        if: always()
        id: upload-gate-terminal
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-terminal-v1-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-terminal.json
          if-no-files-found: error

      - name: Publish gate status panel
        if: always() && steps.upload-gate-terminal.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PRIMARY_RESULT: ${{ needs.primary.result }}
          RUNNER_MODE: ${{ inputs.runner }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
          REVIEW_EXPECTED: ${{ github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository && inputs.runner == 'self' }}
          REPOSITORY_ID: ${{ github.repository_id }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TERMINAL_PATH: ${{ runner.temp }}/gate-terminal.json
          PANEL_DELIVERY_PATH: ${{ runner.temp }}/gate-status-panel-delivery.json
          GATE_PUBLISH_BUDGET_SECONDS: ${{ vars.GATE_PUBLISH_BUDGET_SECONDS || '120' }}
        run: |
          python3 _gate-aggregator-src/.github/actions/gate-aggregator/aggregate.py \
            --quality-result "$QUALITY_RESULT" \
            --primary-result "$PRIMARY_RESULT" \
            --runner "$RUNNER_MODE" \
            --is-draft "$IS_DRAFT" \
            --review-expected "$REVIEW_EXPECTED" \
            --repository-id "$REPOSITORY_ID" \
            --repository "$REPOSITORY" \
            --head-sha "$HEAD_SHA" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --pr-number "$PR_NUMBER" \
            --summary-path "$GITHUB_STEP_SUMMARY" \
            --terminal-path "$TERMINAL_PATH" \
            --panel-delivery-path "$PANEL_DELIVERY_PATH" \
            --publish-only

      - name: Upload gate status panel delivery diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-status-panel-delivery-v1-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gate-status-panel-delivery.json
          if-no-files-found: error
          retention-days: 30

  # ── ledger (independent persistence health check) ───────────────────────
  ledger:
    needs: [quality, primary, gate]
    if: always()
    concurrency:
      group: gate-required-v2-ledger-${{ github.repository_id }}
      cancel-in-progress: false
    runs-on: ${{ (inputs.runner == 'self' && inputs.control_runner != 'github-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","codex"]') || fromJSON('["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout ledger action at this workflow's own commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: _gate-aggregator-src

      - name: Resolve v2 ledger artifacts
        id: resolve-ledger-artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          INPUT_PREFIX: review-ledger-input-v2-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-
          AUDIT_PREFIX: primary-audit-v2-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-
          TERMINAL_PREFIX: gate-terminal-v1-${{ github.repository_id }}-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-
          CURRENT_ATTEMPT: ${{ github.run_attempt }}
          REVIEW_EXPECTED: ${{ github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository && inputs.runner == 'self' }}
        run: |
          set -euo pipefail
          listing="$(mktemp)"
          trap 'rm -f "$listing"' EXIT
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --paginate --slurp > "$listing"
          python3 - "$listing" "$INPUT_PREFIX" "$AUDIT_PREFIX" "$TERMINAL_PREFIX" "$CURRENT_ATTEMPT" "$REVIEW_EXPECTED" "$GITHUB_OUTPUT" <<'PY'
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import datetime
          from pathlib import Path

          argv = sys.argv[1:]
          listing_path, input_prefix, audit_prefix, terminal_prefix, current_text, expected_text, output_path = argv[:7]
          jobs_listing_path = argv[7] if len(argv) > 7 else ""
          attempt_listing_path = argv[8] if len(argv) > 8 else ""
          current = int(current_text)
          if expected_text not in {"true", "false"}:
              raise SystemExit("REVIEW_EXPECTED must be true or false")
          payload = json.loads(Path(listing_path).read_text(encoding="utf-8"))
          pages = payload if isinstance(payload, list) else [payload]
          artifacts = []
          for page in pages:
              if not isinstance(page, dict) or not isinstance(page.get("artifacts"), list):
                  raise SystemExit("current run artifact listing has invalid JSON shape")
              artifacts.extend(page["artifacts"])

          def select_artifact(prefix, missing_message, required):
              candidates = []
              for artifact in artifacts:
                  if not isinstance(artifact, dict) or artifact.get("expired") is True:
                      continue
                  name = artifact.get("name", "")
                  if not isinstance(name, str) or not name.startswith(prefix):
                      continue
                  suffix = name[len(prefix):]
                  if not re.fullmatch(r"[0-9]+", suffix):
                      continue
                  attempt = int(suffix)
                  # input/audit/terminal may reuse an earlier attempt of this run.
                  # never select an attempt newer than the current run attempt.
                  artifact_id = artifact.get("id")
                  if attempt <= current and isinstance(artifact_id, int) and not isinstance(artifact_id, bool):
                      candidates.append((attempt, artifact_id, name))
              if not candidates:
                  if required:
                      raise SystemExit(missing_message)
                  return None
              return max(candidates, key=lambda item: (item[0], item[1]))

          input_artifact = select_artifact(input_prefix, "No matching required ledger input artifact found", True)
          audit_artifact = select_artifact(audit_prefix, "No matching canonical primary audit artifact found", expected_text == "true")
          terminal_artifact = select_artifact(
              terminal_prefix, "No matching required gate terminal artifact found", True,
          )

          def is_gate_aggregator_job(name):
              return name == "gate" or (isinstance(name, str) and name.endswith(" / gate"))

          def jobs_pages(payload):
              pages = payload if isinstance(payload, list) else [payload]
              jobs = []
              for page in pages:
                  if not isinstance(page, dict) or not isinstance(page.get("jobs"), list):
                      raise SystemExit("current attempt jobs listing has invalid JSON shape")
                  jobs.extend(page["jobs"])
              return jobs

          def attribution_repo():
              repo = os.environ.get("REPOSITORY", "")
              run_id = os.environ.get("RUN_ID", "")
              if not repo or not run_id:
                  raise SystemExit("cannot attribute missing current-attempt terminal: jobs listing not provided")
              return repo, run_id

          def load_current_attempt_jobs():
              if jobs_listing_path:
                  return json.loads(Path(jobs_listing_path).read_text(encoding="utf-8"))
              repo, run_id = attribution_repo()
              proc = subprocess.run(
                  [
                      "gh", "api",
                      f"repos/{repo}/actions/runs/{run_id}/attempts/{current}/jobs",
                      "--paginate", "--slurp",
                  ],
                  check=False, capture_output=True, text=True,
              )
              if proc.returncode != 0:
                  raise SystemExit("Jobs API call failed while attributing a missing current-attempt terminal")
              return json.loads(proc.stdout)

          def load_current_attempt_meta():
              if attempt_listing_path:
                  return json.loads(Path(attempt_listing_path).read_text(encoding="utf-8"))
              repo, run_id = attribution_repo()
              proc = subprocess.run(
                  [
                      "gh", "api",
                      f"repos/{repo}/actions/runs/{run_id}/attempts/{current}",
                  ],
                  check=False, capture_output=True, text=True,
              )
              if proc.returncode != 0:
                  raise SystemExit("Jobs API call failed while attributing a missing current-attempt terminal")
              return json.loads(proc.stdout)

          def parse_utc_datetime(value):
              if not isinstance(value, str) or not value:
                  return None
              text = value[:-1] + "+00:00" if value.endswith("Z") else value
              try:
                  parsed = datetime.fromisoformat(text)
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  return None
              return parsed

          RUN_STARTED_AT_ERROR = (
              "Cannot attribute missing current-attempt terminal: run_started_at is missing or unparseable"
          )

          def parse_run_started_at(payload):
              if isinstance(payload, list):
                  if len(payload) != 1 or not isinstance(payload[0], dict):
                      raise SystemExit("current attempt listing has invalid JSON shape")
                  payload = payload[0]
              if not isinstance(payload, dict):
                  raise SystemExit("current attempt listing has invalid JSON shape")
              parsed = parse_utc_datetime(payload.get("run_started_at"))
              if parsed is None:
                  raise SystemExit(RUN_STARTED_AT_ERROR)
              return parsed

          if terminal_artifact[0] != current:
              payload = load_current_attempt_jobs()
              attempt_started = parse_run_started_at(load_current_attempt_meta())
              aggregator_ran = False
              for job in jobs_pages(payload):
                  if not isinstance(job, dict) or not is_gate_aggregator_job(job.get("name")):
                      continue
                  job_started = parse_utc_datetime(job.get("started_at"))
                  if job_started is None:
                      raise SystemExit(
                          "Cannot attribute missing current-attempt terminal: aggregator job started_at is missing or unparseable"
                      )
                  # timezone-aware datetime compare; copied jobs keep the prior
                  # attempt's started_at, which is earlier than this attempt.
                  if job_started >= attempt_started:
                      aggregator_ran = True
                      break
              if aggregator_ran:
                  raise SystemExit(
                      "Aggregator ran on this attempt but did not produce a terminal artifact"
                  )

          with open(output_path, "a", encoding="utf-8") as output:
              output.write(f"input_artifact_id={input_artifact[1]}\n")
              output.write(f"input_source_attempt={input_artifact[0]}\n")
              output.write(f"audit_artifact_id={audit_artifact[1] if audit_artifact else ''}\n")
              output.write(f"audit_source_attempt={audit_artifact[0] if audit_artifact else ''}\n")
              output.write(f"terminal_artifact_id={terminal_artifact[1]}\n")
              output.write(f"terminal_source_attempt={terminal_artifact[0]}\n")
          PY

      - name: Download v2 review ledger inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.resolve-ledger-artifacts.outputs.input_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/review-ledger-input

      - name: Download canonical primary audit for ledger
        if: ${{ github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository && inputs.runner == 'self' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.resolve-ledger-artifacts.outputs.audit_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/primary-audit

      - name: Download gate terminal envelope for ledger
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ steps.resolve-ledger-artifacts.outputs.terminal_artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/gate-terminal

      - name: Build v2 review effectiveness ledger
        uses: ./_gate-aggregator-src/.github/actions/review-ledger
        with:
          audit-path: ${{ runner.temp }}/primary-audit/primary-review-audit.json
          preflight-path: ${{ runner.temp }}/review-ledger-input/pr-size-preflight.json
          install-path: ${{ runner.temp }}/review-ledger-input/install-result.json
          terminal-path: ${{ runner.temp }}/gate-terminal/gate-terminal.json
          token: ${{ github.token }}
          codex-expected: ${{ github.event.pull_request.draft != true && github.event.pull_request.head.repo.full_name == github.repository && inputs.runner == 'self' }}
          codex-waived: false
          expected-repository-id: ${{ github.repository_id }}
          expected-base-sha: ${{ github.event.pull_request.base.sha }}
          expected-caller-sha: ${{ github.workflow_sha }}
          expected-reusable-workflow-sha: ${{ job.workflow_sha }}

      - name: Upload v2 review effectiveness ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-review-ledger-v2
          path: ${{ runner.temp }}/review-ledger/ledger.jsonl
          if-no-files-found: error
          retention-days: 90

  # ── notify (registry-routed, required-gate-failure only) ────────────────
  # Same fail-only semantics as legacy gate.yml's notify job (see that file
  # for the full webhook/fallback rationale, unchanged here), now triggered by
  # the `gate` aggregator's own conclusion instead of the single legacy job.
  # Uses the same control-plane route as `gate`: default self-hosted, with the
  # fork guard and hosted fallback kept in the expression; the webhook POST is
  # still fail-open and needs no special capability.
  notify:
    needs: gate
    if: failure()
    runs-on: ${{ (inputs.runner == 'self' && inputs.control_runner != 'github-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","linux","codex"]') || fromJSON('["ubuntu-latest"]') }}
    # 迁到自建后必须自己兜住槽位占用:在 hosted 上卡死只是浪费 GitHub 的一次性沙箱,
    # 在自建上卡死会按 GitHub 默认的 6 小时 job 超时占住 44 槽之一。本文件里其余
    # 每个 job 都显式声明了 timeout-minutes,notify 此前是唯一例外(它当时还在
    # hosted)。2 分钟对一次 stdlib 的 webhook POST(自带 10 秒 socket 超时)绰绰有余。
    timeout-minutes: 2
    steps:
      - name: Feishu 门禁失败卡 (P2, fail-open)
        continue-on-error: true
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_CI_WEBHOOK || vars.FEISHU_CI_WEBHOOK }}
          FEISHU_TITLE_PREFIX: ${{ vars.FEISHU_CI_TITLE_PREFIX }}
          REPO:      ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE:  ${{ github.event.pull_request.title }}
          PR_URL:    ${{ github.event.pull_request.html_url }}
          BRANCH:    ${{ github.head_ref }}
          SHA:       ${{ github.event.pull_request.head.sha }}
          TIER:      ${{ inputs.tier }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          hook = os.environ.get("FEISHU_WEBHOOK", "").strip()
          if not hook:
              print("no FEISHU_CI_WEBHOOK secret/var set — skip notify"); raise SystemExit(0)
          title_prefix = os.environ.get("FEISHU_TITLE_PREFIX", "").strip() or "[zlxlabs·CI]"
          repo    = os.environ["REPO"]
          pr      = os.environ.get("PR_NUMBER", "") or "?"
          title   = os.environ.get("PR_TITLE", "") or "(无标题)"
          branch  = os.environ.get("BRANCH", "") or "?"
          sha     = (os.environ.get("SHA", "") or "")[:12]
          tier    = os.environ.get("TIER", "") or "?"
          pr_url  = os.environ.get("PR_URL", "") or ""
          run_url = os.environ["RUN_URL"]
          body = (f"**仓库** `{repo}`\n"
                  f"**PR** #{pr} · {title}\n"
                  f"**分支** `{branch}`  ·  **commit** `{sha}`  ·  **tier** `{tier}`\n"
                  f"Required Gate v2 门禁失败(quality / primary review 其一未过)。点按钮看详情。")
          card = {
              "msg_type": "interactive",
              "card": {
                  "config": {"wide_screen_mode": True},
                  "header": {"template": "orange",
                             "title": {"tag": "plain_text", "content": f"🟠 {title_prefix} P2 门禁失败 · {repo}#{pr}"}},
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": body}},
                      {"tag": "action", "actions": [
                          {"tag": "button", "text": {"tag": "plain_text", "content": "查看 Run"},
                           "type": "primary", "url": run_url},
                          {"tag": "button", "text": {"tag": "plain_text", "content": "查看 PR"},
                           "type": "default", "url": pr_url},
                      ]},
                  ],
              },
          }
          req = urllib.request.Request(
              hook, data=json.dumps(card).encode(), headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=10) as r:
                  print("feishu resp:", r.status, r.read(300).decode("utf-8", "replace"))
          except Exception as e:
              print("feishu notify failed (swallowed):", e)
          PY
