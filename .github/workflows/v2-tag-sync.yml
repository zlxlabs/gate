name: v2 tag sync

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [canary-verified]
  # Best-effort polling only: GitHub may drop an entire run of scheduled
  # events, so correctness must not depend on this clock. v2 may lag main;
  # it only points at the newest main commit the canary actually ran green.
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: v2-tag-sync
  cancel-in-progress: false

permissions:
  contents: write

env:
  V2_LAG_HOURS: "6"
  V2_LAG_MAIN_COMMITS: ""

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      advance: ${{ steps.guard.outputs.advance }}
      target_sha: ${{ steps.evidence.outputs.target_sha }}
      move: ${{ steps.monotonicity.outputs.move }}
      guard_outcome: ${{ steps.collect.outputs.guard_outcome }}
      evidence_outcome: ${{ steps.collect.outputs.evidence_outcome }}
      monotonicity_outcome: ${{ steps.collect.outputs.monotonicity_outcome }}
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Evaluate migration switch and breaker
        id: guard
        env:
          V2_TAG_SYNC_ENABLED: ${{ vars.V2_TAG_SYNC_ENABLED }}
          EVENT_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -euo pipefail
          if [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            commit_messages="$(git log --format=%B "${EVENT_BEFORE}..${GITHUB_SHA}")"
          else
            commit_messages="$(git log -1 --format=%B "${GITHUB_SHA}")"
          fi
          if python3 scripts/v2_tag_guard.py \
            --enabled "${V2_TAG_SYNC_ENABLED:-}" \
            --commit-message "${commit_messages}" \
            --hold-file ".github/v2-tag-sync.hold"
          then
            echo "advance=true" >> "$GITHUB_OUTPUT"
          else
            echo "advance=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch the remote v2 tag for promotion checks
        if: steps.guard.outputs.advance == 'true'
        run: git fetch --force origin refs/tags/v2:refs/tags/v2

      - name: Select newest canary-verified main commit
        id: evidence
        if: steps.guard.outputs.advance == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t candidate_shas < <(git log --format=%H -n 20 refs/remotes/origin/main)
          candidate_args=()
          for candidate_sha in "${candidate_shas[@]}"; do
            candidate_args+=(--candidate "${candidate_sha}")
          done
          main_tip="$(git rev-parse refs/remotes/origin/main)"
          current_v2_commit_time="$(git show -s --format=%cI 'refs/tags/v2^{commit}')"
          target_sha="$(python3 scripts/v2_tag_promotion_evidence.py \
            "${candidate_args[@]}" \
            --main-tip "${main_tip}" \
            --current-v2-commit-time "${current_v2_commit_time}")"
          echo "target_sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify v2 target only moves forward
        id: monotonicity
        if: steps.evidence.outputs.target_sha != ''
        env:
          TARGET_SHA: ${{ steps.evidence.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(git rev-parse --verify 'refs/tags/v2^{commit}')"
          python3 scripts/v2_tag_promotion_evidence.py --check-ancestor "${current_sha}" "${TARGET_SHA}"
          if [ "${current_sha}" = "${TARGET_SHA}" ]; then
            echo "move=false" >> "$GITHUB_OUTPUT"
          else
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install contract-check dependencies
        if: steps.monotonicity.outputs.move == 'true'
        run: python3 -m pip install --disable-pip-version-check --no-input pytest pyyaml

      - name: Verify the v2 caller contract before moving the tag
        if: steps.monotonicity.outputs.move == 'true'
        run: python3 -m pytest -q tests/test_gate_caller_contract_guard.py

      - name: Record step outcomes for the publishing jobs
        id: collect
        if: always()
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
          MONOTONICITY_OUTCOME: ${{ steps.monotonicity.outcome }}
        run: |
          {
            echo "guard_outcome=${GUARD_OUTCOME}"
            echo "evidence_outcome=${EVIDENCE_OUTCOME}"
            echo "monotonicity_outcome=${MONOTONICITY_OUTCOME}"
          } >> "$GITHUB_OUTPUT"

  # Failure-path probe (gate-hub#1426): the canary only exercises the success
  # path, so a consumer that swallows every real error into
  # SOURCE-CLIENT-CONTRACT still promotes.  Before the tag moves, run the
  # candidate commit's own fragment (scripts/v2_source_failure_probe.sh from
  # the checked-out tree) against the host-deployed client on the runner that
  # actually carries it.  This job failing — or never reaching success —
  # leaves v2 on its old commit.
  failure-probe:
    needs: sync
    if: needs.sync.outputs.move == 'true'
    runs-on: [self-hosted, linux, ci]
    steps:
      - name: Check out the selected candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.sync.outputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Probe the failure path with the host-deployed client
        run: bash scripts/v2_source_failure_probe.sh

  publish:
    needs: [sync, failure-probe]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history and tags
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Move v2 to selected canary-verified main commit
        id: move
        if: needs.sync.outputs.move == 'true' && needs['failure-probe'].result == 'success'
        env:
          TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
        run: |
          set -euo pipefail
          intended_sha="${TARGET_SHA}"
          set +e
          git push origin "${intended_sha}:refs/tags/v2" --force
          push_status=$?
          set -e
          if remote_result="$(git ls-remote origin refs/tags/v2)"; then
            :
          else
            query_status=$?
            echo "::error::remote v2 verification failed: git ls-remote exited ${query_status} after push (push exit code ${push_status})"
            exit 1
          fi
          python3 - "${intended_sha}" "${push_status}" "${remote_result}" <<'PY'
          import sys
          from scripts.v2_tag_guard import verify_remote_tag

          raise SystemExit(
              0 if verify_remote_tag(sys.argv[1], int(sys.argv[2]), sys.argv[3]) else 1
          )
          PY

      - name: Report v2 tag sync state
        if: always()
        env:
          ENABLED: ${{ vars.V2_TAG_SYNC_ENABLED }}
          GUARD_OUTCOME: ${{ needs.sync.outputs.guard_outcome }}
          ADVANCE: ${{ needs.sync.outputs.advance }}
          EVIDENCE_OUTCOME: ${{ needs.sync.outputs.evidence_outcome }}
          TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
          MONOTONICITY_OUTCOME: ${{ needs.sync.outputs.monotonicity_outcome }}
          MOVE: ${{ needs.sync.outputs.move }}
          MOVE_OUTCOME: ${{ steps.move.outcome }}
          PROBE_RESULT: ${{ needs['failure-probe'].result }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GUARD_OUTCOME}" != "success" ]]; then
            state="query_failed"
          elif [[ "${ADVANCE}" != "true" ]]; then
            if [[ "${ENABLED}" != "true" ]]; then state="disabled"; else state="held"; fi
          elif [[ "${EVIDENCE_OUTCOME}" != "success" ]]; then
            state="query_failed"
          elif [[ -z "${TARGET_SHA}" ]]; then
            state="no_eligible_candidate"
          elif [[ "${MONOTONICITY_OUTCOME}" != "success" ]]; then
            state="query_failed"
          elif [[ "${MOVE}" == "false" ]]; then
            state="already_current"
          elif [[ "${PROBE_RESULT}" != "success" ]]; then
            state="failure_probe_failed"
          elif [[ "${MOVE_OUTCOME}" == "success" ]]; then
            state="promoted"
          else
            state="query_failed"
          fi
          state_line="V2-TAG-SYNC-STATE: ${state}"
          echo "${state_line}"
          echo "${state_line}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Report v2 lag quadruplet
        id: lag
        if: always() && needs.sync.outputs.guard_outcome == 'success'
        env:
          TARGET_SHA: ${{ needs.sync.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          v2_ls="$(git ls-remote origin refs/tags/v2)"
          main_ls="$(git ls-remote origin refs/heads/main)"
          python3 tests/v2_lag_observe.py \
            --v2-ls-remote "${v2_ls}" \
            --main-ls-remote "${main_ls}"
