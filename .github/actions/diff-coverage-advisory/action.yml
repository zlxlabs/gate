name: Diff coverage advisory
description: >-
  Write a one-line diff-coverage advisory to the Actions job summary from the
  caller workspace's coverage/lcov.info. Never gates; failures degrade to a
  missing note. Does not create or update a PR comment.
inputs:
  base-sha: { required: true }
  head-sha: { required: true }
  lcov-path:
    description: Path to lcov.info relative to the caller workspace root.
    required: false
    default: coverage/lcov.info
  token: { required: true }
runs:
  using: composite
  steps:
    - name: Measure diff coverage and post advisory note
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        GITHUB_REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        # advisory 本身是非门禁、可降级的（缺 diff-cover 时退化为 missing
        # note 并返回 0）。本步骤禁用运行期装包：quality 槽与 Silo 密钥同机，
        # 每次从包索引拉取既计费又不可审计；diff-cover 需要预装进 runner
        # 镜像，而不是每次取包。
        python3 "$GITHUB_ACTION_PATH/advisory.py" \
          --base-sha "${{ inputs.base-sha }}" \
          --head-sha "${{ inputs.head-sha }}" \
          --lcov-path "${{ inputs.lcov-path }}"
